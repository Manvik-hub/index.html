0:[
[`M. Hamel arrives in his green coat, frilled shirt and black silk embroidered cap, worn only on inspection or prize days. What does this choice reveal about his feelings, and how does it shape the mood of the classroom?`,
`M. Hamel's formal dress, normally reserved for inspections and prize distributions, shows that he treats his final lesson as a ceremony of honour. By dressing grandly he pays tribute to the French language and to the village children he has taught for forty years. The unusual attire also unsettles Franz, who senses that something solemn has happened. Together with the silent classroom, the village elders sitting at the back and the absence of the usual noise, the costume creates a mood of reverence and grief. Franz first suspects a holiday, but the attire turns his curiosity into dread. Thus Daudet uses clothing as a symbol: it dignifies the language, signals loss, and prepares the reader for the emotional climax when Hamel chokes and writes "Vive la France!" on the blackboard.`],
[`Franz says, "Will they make them sing in German, even the pigeons?" What does this remark show about his understanding of linguistic imperialism, and how has the lesson changed him?`,
`Franz's remark is both innocent and perceptive. Hearing that Berlin has ordered German to be taught in Alsace and Lorraine, he jokes that even the pigeons might be forced to coo in German. The humour exposes the absurdity of imposing a language on a people and hints that language is tied to identity and freedom. Earlier Franz neglected his studies, skipped lessons for birds' eggs and sliding on the Saar, and dreaded participles. After the announcement he feels shame and regret; his books, once a burden, now feel like old friends. He understands that he took the language for granted until it was snatched away. The pigeon remark therefore marks his awakening: he grasps that political domination begins by silencing mother tongues, and that learning is a privilege.`]],
1:[
[`Saheb-e-Alam, the ragpicker boy, scrounges for gold in garbage heaps of Seemapuri, and later works at the tea stall. Explain how Anees Jung uses his name and his changed circumstances to portray the loss of freedom and childhood.`,
`Saheb's name means "lord of the universe", yet he wanders barefoot in Seemapuri's garbage dumps, a refugee from Dhaka whose family lost their fields to storms. Ironically, the name highlights how poverty strips children of dignity. For him garbage is gold: he sometimes finds a rupee or even a ten-rupee note. His freedom to roam, however free from school, is illusory because it is dictated by hunger. When he joins the tea stall, he earns 800 rupees and meals, but loses even that freedom; the steel canister he carries seems heavier than the plastic bag he once carried because it is no longer his own. Jung thus shows how child labour exchanges one kind of bondage for another and robs children of play, education and identity.`]],
3:[
[`Edla Willmansson tells the peddler he may spend Christmas Eve at the Ramsjö ironworks, yet he leaves the stolen thirty kronor behind and signs himself "Captain von Stahle". What transformation does Selma Lagerlöf depict, and which events cause it?`,
`The peddler begins as a cynic who sees the world as a rattrap baited with food and shelter, tempting people into ruin. His own theft of the crofter's thirty kronor proves him right, because he becomes trapped in the forest. The ironmaster mistakes him for an old regimental comrade, but it is Edla, the daughter, who sees through him and still offers kindness and a Christmas invitation. Her trust, unlike the ironmaster's conditional charity, awakens his conscience. He returns the money, leaving a letter and a gift for her, calling himself a captain whom the world has treated badly. The story thus argues that compassion, not suspicion, redeems people, and the rattrap metaphor becomes the peddler's own self-recognition.`]],
2:[
[`Douglas nearly drowns at the Yakima YMCA pool at ten, and years later swims in the Wisconsin and Cascade lakes. How does the author overcome his fear of water, and what lesson does the essay hold about courage?`,
`At ten, Douglas is thrown into the deep end by a bully and sinks to the bottom, panicking before he kicks off the floor to surface. The terror stays for years: even the sight of water in the Cascades leaves him cold. He hires an instructor, who builds his confidence slowly, first by holding him with a rope, then by exercises that strengthen his legs, arms and breathing, until he can swim across the pool. Finally, at Meadow Lake, he conquers fear itself. The essay teaches that fear must be faced, not avoided. Douglas says that he learned to "fear nothing but fear itself", and the experience gave him a new zest for life, demonstrating how perseverance and patient training transform dread into strength.`]],
13:[
[`Charley discovers a third level at Grand Central Station and buys tickets to Galesburg in 1894. Is the third level real or a wish-fulfilment of an overstressed mind? Support your view with evidence from the story.`,
`Jack Finney leaves the question open, but strong evidence supports both views. Charley's psychiatrist friend calls the third level a waking dream, born of a mind that craves escape from anxiety, insecurity and the modern world. Yet Charley finds a first-day cover, old-style tickets, and a clerk in a straw hat, and later older money he cannot use. Sam Weiner, the psychiatrist, even vanishes, then leaves a letter: he and his wife Louisa have moved to Galesburg in 1894 after finding the third level, and Charley finds a letter of his own. Because the physical letter dated 1894 survives, the story encourages readers to believe that nostalgia, warmth and slow-paced life can feel more real than the stressful present.`]]
,
4:[[`Why does Louis Fischer treat Gandhi's refusal to leave Champaran as a turning point, and how does Rajkumar Shukla's persistence set events in motion?`,`Shukla, an illiterate peasant, follows Gandhi from Lucknow to Kanpur until he promises to visit Champaran. There Gandhi defies the order to leave, is ready for jail, and forces an inquiry. Accepting a 25 percent refund, he frees peasants from fear and shows that ordinary people can resist injustice nonviolently.`]],
5:[[`How do the make-up department and the "pancake" make-up at Gemini Studios reveal the writer's amused view of film-making in the 1940s?`,`Spender's Gemini colleagues, such as the Office Boy who dreamt of being a poet, show how wasted talent drifted into film. Make-up men treated every face with pancake and saw actors as products; the studio's chaotic, hierarchical life is observed with gentle irony.`]],
6:[[`Umberto Eco says he is a scholar who also writes novels. How does his reply to Mukund Padmanabhan challenge the usual idea of fame and the interview itself?`,`Eco explains that he works across subjects and treats his novels as a hobby, quietly refusing the label of celebrity. His humour and calm show that depth, not publicity, matters, while Silvester's debate on interviews as intrusion shows how the form shapes public image.`]],
7:[[`How does Sophie's fantasy of meeting Danny Casey differ from Jansie's and Geoff's attitude to reality in "Going Places"?`,`Sophie dreams of owning a boutique and of Danny Casey calling her, even claiming she has met him. Jansie is practical, Geoff sceptical. Her fantasy offers escape from a dull Irish home, but its collapse at the end reveals the gap between ambition and circumstance.`]],
8:[[`What contrast does Kamala Das draw between her mother's ashen face and the "young trees sprinting" outside the car, and why does she end with a smile?`,`The mother's pale, corpse-like face reflects old age and the poet's fear of losing her. Beyond the window, trees and happy children suggest life and youth. The poet hides her pain and says "see you soon", a brave smile that reassures both of them.`]],
9:[[`How does Stephen Spender use images like "sour cream" walls, a rat-eaten map and Shakespeare's head to criticise the slum classroom?`,`The walls, tinted like sour cream, and the map of the world that means nothing to the children show confined, neglected lives. Spender asks the governor and inspectors to give them a new world of sunlight and learning, so they can escape the slums.`]],
10:[[`In "Keeping Quiet", what does Neruda mean by counting up to twelve and keeping still, and how is it different from inactivity or death?`,`Neruda wants a brief shared silence in which people stop wars, hurry and harm to nature. This stillness leads to self-reflection and unity. He insists it is not death; life goes on beneath it, as the earth does when it seems quiet.`]],
11:[[`According to Keats, how do things of beauty offset the "dark spirits" of daily life, and which examples does he give?`,`A thing of beauty never fades into nothingness; it brings sweet dreams, health and quiet breathing. The sun, moon, trees, daffodils, streams and tales of mighty dead give comfort despite gloom, and flow like an endless fountain from heaven.`]],
12:[[`How do the tigers on Aunt Jennifer's tapestry contrast with her own life, and what does the "massive weight of Uncle's wedding band" symbolise?`,`The proud tigers prance fearlessly, representing the freedom and courage Jennifer lacks. The heavy wedding band symbolises male dominance and oppressive marriage that makes her fingers tremble. Her art becomes quiet rebellion, outliving her, while she remains terrified.`]],
14:[[`How does the Maharaja of Pratibandhapuram, Jung Bahadur, try to defy the prophecy about his death, and how does it still come true?`,`He kills 99 tigers, bans tiger hunts by others and even marries into a family with many tigers. At his son's birthday he buys a wooden toy tiger for the hundredth; a splinter pricks his hand, the wound festers and he dies, mocking human pride.`]],
15:[[`What does Tishani Doshi's account of Antarctica, with Gondwana and Goa, teach about climate change and human responsibility?`,`Tishani Doshi describes an icy continent whose rocks show Goa was once joined to it, and ice cores that record Earth's past. She warns that melting ice and pollution threaten the planet, so students of nature must protect it.`]],
16:[[`Why does Dr. Sadao Hoki shelter the American prisoner Tom despite his duty as a Japanese patriot, and how do Hana and the General respond?`,`Sadao, trained in Boston, cannot turn away a dying man. He treats Tom's wounds, hides him and finally arranges his escape by boat. Hana helps, though reluctantly, while the General, needing Sadao, protects him; humanity overcomes national hatred.`]],
17:[[`How does the friendship between Mr. Lamb and the burnt boy Derry in "On the Face of It" help Derry accept himself?`,`Derry hides from people because of his burnt face. The old man with a tin leg welcomes him into his garden, where he learns that people are not just faces. Lamb's death leaves him determined to face the world, not hide.`]],
18:[[`How does Zitkala-Sa's loss of her long hair in the mission school reveal the cruelty of forced cultural assimilation?`,`In her culture only cowards and mourners cut their hair. Hiding under the bed, she is dragged out and shorn, feeling like a "little animal driven by a herder". The incident shows how institutions stripped Native children of identity and dignity.`]]

1:[[`How does Mukesh's ambition to be a motor mechanic contrast with the fatalism of the bangle makers of Firozabad?`,`Mukesh wants to be a mechanic and is ready to walk to a garage, while his family accepts fate and caste burdens. The bangle makers, trapped by moneylenders and police, cannot imagine change. Mukesh's dream shows the hope of the young.`]],
2:[[`What physical and mental symptoms of terror does Douglas describe when he nearly drowns, and how do they shape his later life?`,`He describes swallowing water, a green haze, and legs paralysed by fear. Each time he rose, he panicked again. Afterwards he trembled near water for years, losing the joy of canoeing, fishing and swimming until he overcame the memory.`]],
3:[[`How do the ironmaster's and Edla's behaviour toward the peddler differ, and why does the author contrast them?`,`The ironmaster is hasty, mistaking him for Captain von Stahle, and is angry when the truth emerges. Edla, thoughtful and gentle, still welcomes him. The contrast shows that superficial charity is weaker than genuine, understanding kindness.`]],
4:[[`What constructive work did Gandhi organise in Champaran beyond the legal inquiry, and why did he consider it vital?`,`Gandhi opened village schools with volunteers, taught hygiene, and engaged a doctor with Kasturba's help. He believed that political freedom needed social improvement and self-reliance, so peasants would not depend on any outsider.`]],
5:[[`What was the role of Kothamangalam Subbu at Gemini Studios, and how did the poets and the "Legal Adviser" add to its odd atmosphere?`,`Subbu was Vasan's chief of story department, a poet and a generous man who wrote comic verses. The Legal Adviser, who wore a coat and sat unused, was paid to fight no cases. The staff reveal the studio's relaxed, quirky creative world.`]],
6:[[`How does Rudyard Kipling's resentment of interviews, cited by Silvester, support the view that interviews can intrude on privacy?`,`Silvester recalls Kipling calling interviews immoral and a crime. Others like Lawrence felt it stole a part of the soul. The comparison shows that opinion on the interview as an art form is divided between truth-seeking and intrusion.`]],
7:[[`What does the closing scene, in which Sophie waits by the bridge for Danny, suggest about the power and limit of fantasy?`,`Sophie imagines the meeting so intensely that she waits in vain. The silent ending shows her longing and loneliness, and warns that dreams without action cannot change reality.`]],
8:[[`What is the effect of the simile "pale as a late winter's moon" and of the "old familiar ache" in the poem's ending?`,`The moon simile shows the mother's lifeless, fading face, hinting at ageing and death. The "childhood fear" returns, and the poet's smile hides fear, linking the opening car-window image with the closing farewell.`]],
9:[[`How does Spender portray the individual children, such as the "tall girl with her head bowed" and the boy "stunted, unlucky heir", as victims of poverty?`,`The tall girl, lost in dreams, and the boy with inherited disease show despair and ill health. Their bent heads and dull eyes express society's neglect, which the poem urges leaders to remedy.`]],
10:[[`What examples of destructive human activity does Neruda list in "Keeping Quiet", and what alternative does he suggest?`,`He speaks of fishermen harming whales, men gathering salt who see their hurt hands, and wars with gas and fire. Silence and togetherness would let us pause and think of preserving life instead.`]],
11:[[`What does Keats mean by saying that beauty weaves "a flowery band to bind us to the earth"?`,`The image says that beauty ties human beings to life despite sorrow, gloom and disappointment. Nature, stories of noble heroes and daily joy form a bond that lifts the human spirit.`]],
12:[[`What do the words "sleek" and "chivalric certainty" suggest about the tigers, and how do they differ from Jennifer's fear?`,`Sleek and chivalric show confidence, grace and fearless honour. The tigers walk unafraid beneath green trees, while Jennifer's fingers can barely pull the needle, showing her suppressed life.`]],
14:[[`What part does the Dewan play in the Tiger King's story, and how does his advice sustain the Maharaja's obsession?`,`The Dewan flatters the ruler and cleverly arranges tigers to be brought, including the final hunt. He is torn between loyalty and fear of the King's anger. His submission highlights the flattery that encourages tyranny.`]],
15:[[`What does Doshi mean by describing the Drake Passage and the continent as the "earth's memory", and how does it link past and future?`,`The ice cores and rocks hold records of the planet's temperature and gases. Understanding them helps people predict the climate, so Antarctica is both a scientific archive and a warning.`]],
16:[[`How do the servants and Hana react to the wounded prisoner, and what do their attitudes show about wartime hatred?`,`The servants leave because they fear punishment and distrust the foreigner. Hana at first recoils, then helps with cloth and water. Their reactions show prejudice created by war that compassion has to overcome.`]],
17:[[`How does Mrs. Dasgupta's attitude and the boys who throw stones at Derry reveal the cruelty of society toward a disfigured person?`,`Derry says that people stare, mock and avoid him, and even his mother cannot see him without grief. This hostility explains his bitterness and why Lamb's open friendship matters so much.`]],
18:[[`How does Bama discover untouchability, and what advice does her elder brother give that changes her life?`,`She sees an elderly man carry curry in a packet by its string for the landlord, and her brother explains caste. He tells her to study hard to earn respect, which makes her a top student and later a Dalit writer.`]]

[`What temptations nearly kept Franz from school that morning, and what does his decision to go show?`,`The warm weather, the chirping blackbirds and Prussian soldiers drilling in the field tempted him to skip. Resisting them, he went, though in fear of Hamel's questions on participles, unknowingly attending the final French lesson.`],
[`What did Franz see at the town hall notice board, and how did the blacksmith Wachter's remark mislead him?`,`A crowd stood before the bulletin board, which carried bad news for two years. Wachter told him not to hurry, as he would reach school in time. Franz thought it a joke, unaware of the real order.`],
[`Why does Franz find the unusual silence of the classroom startling?`,`Usually the school hummed with desks opening, lessons repeated aloud and Hamel's ruler rapping. That morning it was calm like a Sunday, so Franz expected punishment for lateness and felt embarrassed.`],
[`How does M. Hamel receive Franz when he enters late, and what does this kindness signify?`,`Instead of scolding, Hamel gently asks him to take his seat, saying they had nearly begun without him. His soft tone shows that this day is special and that strict discipline has given way to affection.`],
[`What announcement does Hamel make about the order from Berlin, and how does it affect the pupils?`,`He says only German will be taught in the schools of Alsace and Lorraine, and the new master comes tomorrow. The pupils are stunned, and Franz feels sorry for wasted time and ashamed.`],
[`Why does Franz say his books now feel like "old friends", and what change in his outlook does this indicate?`,`The grammar and sacred history books were burdens he wanted to leave. Faced with parting from them, he sees their value. He moves from careless boyhood to understanding of what learning and language mean.`],
[`Why does Franz fail to recite the participle rule, and what does the failure teach him?`,`He confuses the rule and stands tongue-tied, head hanging. Hamel does not scold, but blames everyone for postponing study. Franz learns that putting things off can lead to irreparable loss.`],
[`How does Hamel describe the French language, and what does he urge the villagers to do with it?`,`He calls French the clearest, most logical and most beautiful language. He urges them to guard it among themselves and never forget it, because a people holding their language hold the key to their prison.`],
[`Explain Hamel's idea that holding fast to one's language is like having "the key to their prison."`,`Language carries culture, memory and identity. Even enslaved people who keep their language can resist assimilation and one day regain freedom, because the conqueror cannot erase what lives in their speech.`],
[`How do the copy slips reading "France, Alsace, France, Alsace" hanging from the desk rods express patriotism?`,`Hamel had prepared new copies with the names of the lost region, flying like little flags around the room. The slips show the pupils working to write their motherland's name, a quiet pledge of loyalty.`],
[`How does Daudet use the worn benches, walnut trees and hop vine to show Hamel's attachment to the school?`,`Hamel has watched the benches wear, the walnuts grow and the hop vine climb to the windows. His sorrow at leaving them, and his sister's packing upstairs, reveal forty years of devoted routine.`],
[`What is the significance of the church clock striking twelve and the Prussian trumpets during the final lesson?`,`The clock marks the end of an era and the trumpets announce the returning Prussian soldiers, symbols of the conqueror's arrival. The sounds interrupt Hamel and heighten the story's emotional climax.`],
[`How does Franz's view of Hamel change from fear to admiration during the lesson?`,`Franz once feared the ruler and temper. Now he forgets the ruler and pitiable manner, and realises Hamel is leaving after forty years. He admires his patience and wants to make up for being a lazy pupil.`],
[`Why does Hamel write "Vive la France!" on the blackboard, and why does he lean against the wall?`,`Choked with emotion, he cannot speak, so he writes the cry of loyalty in big letters. Leaning his head on the wall, he gestures dismissal, a silent farewell expressing grief and love of country.`],
[`How is the theme of language and freedom developed across the story?`,`Berlin's order, Hamel's praise of French, the pigeons joke and "the key to their prison" together show language as identity. Daudet argues that suppression of a language is political domination.`],
[`How do the village elders, such as the former mayor and the postmaster, add to the mood of the last lesson?`,`The old men, with triangular hats and primers, sit on the back benches and weep as they join in the lesson. Their presence makes the occasion a community mourning and shows shared regret for neglected learning.`],
[`Does Daudet suggest that the villagers share the blame for neglecting French? Support your answer from the story.`,`Yes. Hamel says parents were anxious to put children to work, and he himself used them for gardens and fishing. Everyone postponed learning, so everyone loses it too late.`]

1:[
[`Why did the ragpickers' families leave Dhaka for Seemapuri, and how do they live there?`,`Storms swept away their fields and homes in Bangladesh, so they migrated to Delhi in 1971. They live in mud hutments with roofs of tin and tarpaulin, without sewage or drinking water, surviving on garbage.`],
[`What does the incident of Saheb's tennis shoes reveal about his longing and about social inequality?`,`He wears discarded tennis shoes with holes, a rich boy's cast-offs, yet is delighted. Peering through a fence at a tennis court, he says he plays only when the gate is open, showing that games belong to the privileged.`],
[`How does the narrator respond when Saheb asks about school, and what does his reaction show?`,`When she suggests he go to school, he says there is none in his neighbourhood. When she jokes she will open one, he asks if she will really do it. Later he reports that he has joined and the writer realises it was an empty promise.`],
[`Why does the writer say that garbage is "gold" to the ragpickers and a means of survival to their parents?`,`For children, garbage may bring a coin or a rupee note, a surprise that feels like treasure. For parents it is bread. Anees Jung exposes how poverty can transform filth into hope.`],
[`Describe the working conditions of the glass-bangle workers in Firozabad.`,`Families work in dark, poorly ventilated hutments, before hot furnaces with high temperatures, joining glass rings. Children often lose eyesight before they become adults, since they work in dim light.`],
[`What does Savita, the girl in the faded pink dress, symbolise in the Firozabad episode?`,`Savita sits with a bangle-welder and works mechanically, unaware that bangles symbolise marriage and happiness. She stands for children who make bridal ornaments but do not know any joy themselves.`],
[`How does the idea of caste and destiny, "karam", trap Mukesh's family and neighbours in the bangle trade?`,`Mukesh's grandmother believes bangle-making is their karam, God-given lot. Born in the caste of bangle makers, they accept it and never dream otherwise, so poverty continues for generations.`],
[`Who forms the "vicious circle" that keeps the Firozabad workers poor, and how?`,`Sahukars, middlemen, the police, bureaucrats and politicians exploit them. Moneylenders trap families in debt, and officials block any cooperative. Thus bangle makers are stuck in poverty.`],
[`Why can the bangle makers of Firozabad not organise themselves into a cooperative?`,`They fear being beaten and jailed by the police, who side with moneylenders. Years of exploitation have also left them without leadership or courage, so any attempt at organising collapses.`],
[`What is the significance of the title "Lost Spring"?`,`Spring symbolises childhood and promise. For Saheb and Mukesh, it is lost to labour and poverty. The title laments the death of play, education and hope for millions of child workers.`],
[`Why do the ragpickers lack identity papers, yet hold ration cards, and what does this paradox suggest?`,`They have no permits or documents to prove citizenship, but ration cards let them get grain and vote. The writer shows that their food matters more to authorities than their rights.`],
[`How does Anees Jung explain the bare feet of children as a "tradition", and why is she unconvinced?`,`Some say it is a tradition to go barefoot, but she sees that it is an excuse for poverty. She suspects the reason is a lack of money, and tradition becomes cover for neglect.`],
[`How does the author contrast the glitter of bangles with the grim lives of the workers who make them?`,`Colourful bangles of every shade are the pride of Indian brides, yet the makers live in squalor and darkness. The contrast between beauty and misery underlines the cruelty of exploitation.`],
[`Why does the writer say that the young of Firozabad are "born in debt" and "their spirit is crushed"?`,`Generations inherit debt along with the trade, so they know nothing else. Fear of the system and the lack of vision make them lose spirit, and the cycle of poverty continues.`],
[`How does the story show the failure of child-labour laws in India?`,`Although children working in hazardous furnaces is illegal, thousands do so openly. Police and officials look away, showing that laws mean little without enforcement and welfare.`],
[`Identify two images in "Lost Spring" that convey poverty vividly, and explain their effect.`,`"Roofs of tin and tarpaulin" and "mounds of garbage" evoke a landscape where dignity is absent. These images give readers a concrete sense of the children's world.`],
[`How does the writer use irony in the names Saheb-e-Alam, Mukesh and Savita?`,`Saheb-e-Alam means lord of the universe, though he is a rag-picking beggar. Mukesh and Savita bear names of ordinary ones without hope. Irony underlines the gap between promise and reality.`],

[`How did the wave at Oregon beach and his mother's warnings plant Douglas's fear of water in childhood?`,`At about three or four, a big wave knocked and frightened him at the Oregon beach. His mother's caution about drowning also left him timid and anxious around water.`],
[`What plan did Douglas make at the bottom of the YMCA pool, and why did it fail twice?`,`He planned to land on the floor, spring up like a cork and paddle to the edge. Terror and lack of air made each attempt fail, and he lost hope.`],

[`How does Rajkumar Shukla's appearance and background contrast with his determination to bring Gandhi to Champaran?`,`He was a poor, emaciated, illiterate peasant, yet he followed Gandhi everywhere until he promised to visit Champaran. His simple persistence started the whole movement.`],
[`What was the tinkathia system, and why were the peasants unhappy with it?`,`Landlords forced tenants to plant 15 percent of their land with indigo and surrender the whole crop as rent. It left peasants poor and unable to grow food.`],
[`How did the lawyers at Muzaffarpur react to Gandhi's arrival, and what did he tell them?`,`They explained that they took only poor peasants' fees and were afraid. Gandhi told them to set aside fear, as the peasants were crushed by fear.`],
[`Why did the landlords suddenly agree to refund part of the money after synthetic indigo came to market?`,`Germany developed synthetic indigo, so the natural crop lost value. The landlords tried to get the peasants to pay compensation, but peasants demanded refunds.`],

[`Why did Gandhi refuse the offer of Charles Freer Andrews's help in Champaran?`,`He felt Indians must learn self-reliance and not rely on an Englishman. Depending on outsiders, he said, would weaken the lesson of the movement.`],

[`What is the setting of "My Mother at Sixty-six", and where is the poet going?`,`The poet drives to Cochin airport with her mother, who sits beside her in the car. The long road suggests the approach of parting.`],
[`Why does the poet turn her gaze away from her mother to the world outside the car?`,`Seeing her mother's pale face fills her with fear and pain. Looking outside offers relief, but the contrast only increases her anxiety.`],
[`What does the mother's dozing "open mouthed" suggest about ageing?`,`It suggests weakness, helplessness and nearness to death. The poet notices it as the sign of her mother's frailty.`],
[`Why does the poet recall the airport security check as the car stops?`,`The security check marks the formal parting. It makes her look back at her mother's pale face and the fear returns just before the farewell.`],
[`Why does the poet repeat the word "smile" at the end?`,`The repetition shows effort. She masks her sorrow, and comforts her mother, while hiding her own anguish.`],
[`What do "young trees sprinting" and "merry children spilling out of their homes" represent?`,`They stand for energy, youth and the joy of life. The contrast with her mother's drained face makes the sense of ageing sharper.`],

[`What picture of the salt gatherer does the poet draw, and what does it suggest?`,`The man gathering salt looks at his hurt hands, which suggests exploitation and suffering. A pause would let him see his pain.`],
[`How does the poem envisage "green wars" ending?`,`The men who prepare wars with gas and fire would put on clean clothes and walk with their brothers in shade, doing nothing, and so wars would stop.`],
[`Why does Neruda say "what I want should not be confused with total inactivity"?`,`He wants a thoughtful pause, not idleness or death. Quiet reflection, he suggests, is the start of renewal and care.`],

[`What is meant by "the inhuman dearth of noble natures"?`,`It refers to the lack of noble, generous people in the world. This gloom is lifted by beauty that inspires hope.`],

[`Why does Keats call beauty an "endless fountain of immortal drink"?`,`Like a fountain flowing from heaven, beauty never dries up and constantly refreshes human hearts with joy.`],

13:[
[`How does Charley happen to reach the third level of Grand Central, and why does he first doubt it exists?`,`Hurrying through the station, he takes a wrong turn down a ramp and finds a strange low-ceilinged level. Afterwards he cannot find it again, so he doubts it.`],

[`Who is the Tiger King and how did he get the name?`,`He is the Maharaja of Pratibandapuram, Jilani Jung Jung Bahadur, called Tiger King because he was born to be killed by a tiger and then vowed to kill tigers.`],

16:[
[`How does the setting near the sea and the hospital shape the opening of "The Enemy"?`,`Dr. Sadao's house stands on a quiet Japanese shore, near a private hospital. The isolated setting allows the secret rescue and builds suspense.`],

17:[

18:[

['She had hardly entered the room when the lights went out.','Invert using "Hardly ... when".','Hardly had she entered the room when the lights went out.','With negative adverbials such as "hardly" and "scarcely" at the start, the auxiliary comes before the subject.'],
['He finished the report and left immediately.','Invert using "No sooner ... than".','No sooner had he finished the report than he left.','"No sooner" takes the past perfect in the first clause and the simple past after "than", with subject-auxiliary inversion.'],
['I am not rich, so I cannot buy a villa.','Convert to the subjunctive mood (unreal present).','If I were rich, I could buy a villa.','The subjunctive "were" is used for all persons in a hypothetical present condition, with "would/could" in the main clause.'],
['She talks as if she knows everything.','Rewrite in the subjunctive, showing the situation is unreal.','She talks as if she knew everything.','After "as if/as though" for unreal comparisons, the past form (or "were") is used.'],
['Someone has stolen my wallet.','Change to the passive voice.','My wallet has been stolen.','The present perfect passive is "has/have been + past participle"; the vague agent "someone" is dropped.'],
['People say that he is a genius.','Change to the passive (two ways).','He is said to be a genius. / It is said that he is a genius.','Reporting verbs like "say", "believe" allow impersonal passives with "to + infinitive" or "It is ... that".'],

{t:'Can Machines Be Moral?',topic:'AI & Ethics',p:`Artificial intelligence now writes essays, diagnoses tumours and approves loans, yet its growing influence raises a question older than computing: who is responsible when a machine errs? Engineers argue that an algorithm is merely a tool, as neutral as a hammer. Critics reply that a hammer does not learn from data, and data inherits the prejudices of those who gathered it. A lending model trained on decades of biased decisions will quietly repeat them, with the added authority of apparent objectivity. Some philosophers therefore propose that moral reasoning should be built into systems from the start, through transparent rules and human oversight. Others warn that ethics cannot be reduced to code, because values such as dignity and fairness are contested and shift across cultures. Perhaps the wisest course lies between the two positions: accept that machines will never be moral agents, but insist that their designers and users always are. Responsibility, in this view, cannot be outsourced; it can only be shared more carefully among the people who build, deploy and regulate the technology.`,

RD[1]={t:'The Quiet Arithmetic of Carbon',topic:'Climate Science',p:`Every tonne of carbon dioxide released today lingers in the atmosphere for centuries, which makes climate change less like a flood that recedes and more like a debt that compounds. Scientists measure this burden through the concept of a carbon budget: the total amount of emissions the planet can absorb before global temperatures cross a dangerous threshold. Because the budget is finite, delay is costly; each year of inaction forces steeper cuts later. Sceptics often point out that the climate has always changed, citing ice ages and warm periods long before factories existed. Yet those shifts unfolded over millennia, giving species time to migrate and adapt, whereas the present warming is occurring in mere decades. The difference in speed, rather than the fact of change, is what alarms researchers. Equally troubling are feedback loops: melting ice exposes darker water, which absorbs more heat and melts still more ice. Such cycles can turn a gradual warming into an abrupt one. The task before societies, therefore, is not merely to reduce emissions but to do so quickly enough that natural systems are not overwhelmed before technology and policy can catch up.`,
qa:[['What is the main idea of the passage?','Climate change resembles a compounding debt, so emissions must fall quickly because the carbon budget is limited.'],

['What is a carbon budget?','The total emissions the planet can absorb before temperatures cross a dangerous threshold.'],
['Why is delay described as costly?','Each year of inaction forces deeper cuts later to stay within the same budget.'],
['What argument do sceptics make?','That the climate has always changed, as shown by ice ages and warm periods.'],

RD[2]={t:'Why Cheap Things Cost So Much',topic:'Economics',p:`Economists use the word externality for a cost that falls on someone who never agreed to bear it. A factory that dumps waste into a river enjoys lower production costs, while the fishermen downstream lose their catch and the town pays for cleaner water. The product's price, however, shows none of this, so buyers receive a false signal that the item is cheap. Markets are celebrated for allocating resources efficiently, but they can do so only when prices tell the truth. When they do not, the result is overproduction of harmful goods and underinvestment in clean alternatives. Some economists favour taxes that force producers to pay for the damage they cause, arguing that this restores honest prices without banning anything. Others prefer regulations with strict limits, believing that taxes merely allow wealthy firms to buy the right to pollute. Both camps, however, accept the central insight: a price that ignores harm is not a bargain but a postponed bill. Consumers may enjoy the saving today, yet society as a whole will eventually settle the account, often with interest, through ill health, damaged ecosystems or costly repairs.`,

['What happens when prices do not tell the truth?','Harmful goods are overproduced and clean alternatives are underfunded.'],

['What does "allocating" mean in context?','Distributing or assigning resources to different uses.'],
['What is the author\'s overall tone?','Analytical and balanced, but critical of ignoring hidden costs.']]};
 
 
 
RD[3]={t:'The Examined Life',topic:'Philosophy',p:`Socrates is said to have declared at his trial that the unexamined life is not worth living, a sentence that has outlived the city that condemned him. He did not mean that everyone should become a scholar. He meant that a person who never questions inherited beliefs, daily habits or personal ambitions is living by default rather than by choice. Examination, in this sense, is not endless doubt. It is the discipline of asking why we hold a view and whether we would still hold it after hearing the best argument against it. Critics reply that constant self-scrutiny can paralyse action; a person forever weighing motives may never commit to anything. The answer, perhaps, lies in rhythm rather than rule: reflection and action need not be enemies if each is given its season. A farmer who studies the weather before sowing is not delayed by thought but guided by it. Likewise, a citizen who pauses to test a political slogan against evidence is not wasting time but protecting freedom. The examined life, therefore, does not promise certainty. It offers something humbler and more useful: the assurance that our choices, whether right or wrong, were truly our own.`,
qa:[[`What is the main idea of the passage?`,`Questioning our beliefs and choices, in balance with action, gives life real ownership.`],
[`What did Socrates not mean by the unexamined life?`,`He did not mean everyone must become a scholar; he meant people should not live without questioning.`],
[`What does "living by default" mean in context?`,`Following inherited beliefs and habits automatically instead of choosing deliberately.`],
[`How does the author define examination?`,`As the discipline of asking why we hold a view and whether it survives the best opposing argument.`],
[`What criticism is made of constant self-scrutiny?`,`That it can paralyse action, leaving a person unable to commit to anything.`],
[`How does the author answer this criticism?`,`By suggesting reflection and action each have their season and need not be enemies.`],
[`What point does the farmer example make?`,`Thought can guide action, as studying weather helps sowing instead of delaying it.`],
[`Why does the citizen who tests a slogan "protect freedom"?`,`Checking claims against evidence prevents manipulation by empty slogans.`],
[`What can be inferred from "outlived the city that condemned him"?`,`Ideas can survive and outlast the political power that tried to silence them.`],
[`What does the examined life finally offer, according to the author?`,`Not certainty but the assurance that our choices were truly our own.`]]};
RD[4]={t:'The Cost of Telling the Truth',topic:'Ethics',p:`A whistleblower occupies an uncomfortable place in public life: admired in principle, resented in practice. When an employee exposes wrongdoing inside an organisation, she breaks a workplace norm of loyalty yet upholds a deeper duty to the public that the organisation serves. The ethical tension is real. Colleagues may lose their jobs because of the revelation, and the company's reputation, built over decades, may collapse in days. Defenders argue that loyalty owed to an institution cannot extend to concealing harm; a hospital that hides dangerous errors, for instance, forfeits the right to silence. Opponents counter that internal channels should be exhausted first, since public exposure can punish the innocent along with the guilty. Evidence suggests, however, that internal complaints are often ignored and sometimes met with retaliation, which leaves many employees with a stark choice between conscience and career. Societies that protect whistleblowers legally tend to uncover fraud earlier and at lower cost. Protection, then, is not charity to individuals but an investment in transparency. A culture that punishes those who speak truth will soon discover that it has taught everyone else to stay silent.`,
qa:[[`What is the central argument of the passage?`,`Whistleblowers should be legally protected because transparency benefits society.`],
[`What does "admired in principle, resented in practice" mean?`,`People praise truth-telling in theory but dislike the person who exposes them.`],
[`Which two duties conflict for the whistleblower?`,`Loyalty to the organisation and a deeper duty to the public.`],
[`What example do defenders give?`,`A hospital hiding dangerous errors loses its right to silence.`],
[`What do opponents want employees to do first?`,`Exhaust internal channels, since public exposure may harm the innocent.`],
[`Why do many employees go public despite this?`,`Internal complaints are often ignored or met with retaliation.`],
[`What does "retaliation" mean here?`,`Punishment or revenge against someone for complaining.`],
[`What does "forfeits" mean in the passage?`,`Loses a right as a penalty.`],
[`What is the effect of legal protection for whistleblowers?`,`Fraud is uncovered earlier and at lower cost.`],
[`What does the last sentence imply?`,`Punishing truth-tellers teaches others to stay silent, weakening transparency.`]]};
RD[5]={t:'Work After Automation',topic:'AI and Society',p:`Every wave of automation has provoked the same fear: that machines will leave people with nothing to do. The weaving loom, the assembly line and the spreadsheet each eliminated certain tasks, yet new occupations appeared that earlier generations could not have imagined. Optimists cite this pattern as proof that technology creates more work than it destroys. Yet the present wave differs in one important respect. Earlier machines replaced muscle; artificial intelligence increasingly replaces routine judgment, such as drafting letters, sorting applications or reading scans. Jobs once considered safe because they required education are now exposed. Economists therefore stress that the outcome depends less on technology than on choices about training and sharing gains. If productivity rises but the benefits flow only to owners of machines, inequality will widen even as output grows. If workers are retrained and given a stake in the new efficiency, the same technology can shorten working hours and raise living standards. The question, then, is not whether machines will take over but who will decide how their advantages are distributed. History suggests that societies which plan for transition adapt successfully, while those that merely hope for the best pay the price in dislocation and anger.`,

[`What does "merely hope for the best" imply?`,`Doing nothing but wishing, without planning for change.`],
[`How would you describe the author's tone?`,`Balanced and analytical, but warning against complacency.`]]};
RD[6]={t:`The Gig Economy's Bargain`,topic:'Economics',p:`Platform work promises a bargain: workers choose their own hours, and customers receive services at the tap of a screen. For students, parents and retirees seeking supplementary income, such flexibility is a genuine advantage. Yet behind the freedom lies an unequal arrangement. Because gig workers are classed as independent contractors, they typically receive no sick pay, pension contributions or protection against sudden dismissal. The platform, meanwhile, sets prices, assigns tasks and rates performance through algorithms that workers can neither see nor challenge. Supporters argue that this arrangement keeps costs low and lets thousands of small businesses survive. Critics reply that the savings are achieved by shifting risk from companies, which can bear it, to individuals, who cannot. A driver who falls ill loses a day's income, and one who is injured may lose a year's. Some governments have responded by creating a middle category of worker with limited rights, hoping to preserve flexibility while guaranteeing a basic safety net. Whether such compromises succeed remains uncertain. What is clear is that flexibility, when it benefits only one side, is a word that disguises dependence. A fair bargain needs freedom that is shared, not merely advertised.`,

[`What does the last sentence suggest about the word "flexibility"?`,`It can disguise dependence if only one side gains.`]]};
RD[7]={t:`The Ocean's Hidden Burden`,topic:'Climate Science',p:`The ocean is the planet's largest shock absorber, soaking up roughly a quarter of the carbon dioxide humans release and most of the excess heat trapped by greenhouse gases. This service has slowed the warming of the land on which we live, but it comes at a cost that is easy to overlook because it unfolds beneath the surface. As seawater absorbs carbon dioxide, it becomes more acidic, making it harder for corals, oysters and tiny plankton to build their shells and skeletons. Since plankton form the base of marine food chains, even a small decline can ripple upward to fish, seabirds and the millions of people who depend on fisheries. Warmer water also holds less oxygen, creating zones where marine life struggles to breathe. Scientists caution that these changes are not easily reversed, since the deep ocean takes centuries to mix. Yet the ocean's role is rarely central in public debate, which tends to focus on forests and fossil fuels. Recognising it as a partner in climate regulation, and not an unlimited sink, would change how emissions targets are judged. What we cannot see is not necessarily harmless; it is merely slower to complain.`,
qa:[[`What is the main idea of the passage?`,`The ocean absorbs much of our carbon and heat, but at a hidden and serious cost.`],
[`Why is the ocean called a "shock absorber"?`,`It soaks up much of the carbon dioxide and excess heat we produce.`],
[`How does carbon dioxide affect seawater?`,`It makes it more acidic, harming shell and skeleton building.`],
[`Why does a decline in plankton matter?`,`Plankton form the base of marine food chains, so effects ripple up to fish and people.`],
[`How does warming affect oxygen?`,`Warmer water holds less oxygen, creating zones where marine life struggles.`],
[`Why are these changes not easily reversed?`,`The deep ocean takes centuries to mix.`],
[`Why is the ocean overlooked in public debate?`,`Attention goes mostly to forests and fossil fuels.`],
[`What does "sink" mean in "unlimited sink"?`,`Something that absorbs and stores waste without limit.`],
[`What does the final sentence imply?`,`Hidden damage is still damage; the ocean suffers quietly, not harmlessly.`],
[`What is the author's tone?`,`Cautionary and informative, urging wider recognition of the ocean's role.`]]};

poetry:()=>`<h1 class="text-3xl font-bold">Flamingo Poetry</h1><p class="text-slate-600">Open a poem to see its questions and model answers.</p>`+chapterList('e'),
vistas:()=>`<h1 class="text-3xl font-bold">Vistas</h1><p class="text-slate-600">Open a chapter to see its questions and model answers.</p>`+chapterList('v'),
grammar:()=>`<h1 class="text-3xl font-bold">Grammar</h1><div class="mt-3 rounded-xl bg-indigo-50 border border-indigo-200 p-4 text-sm"><b>How to use:</b> read the <b>original sentence</b>, follow the <b>task</b> in the purple box, write your own answer, then press <b>Show answer</b> to check it. (${GR.length} tasks written)</div><div class="space-y-5 mt-5">`+GR.map((g,i)=>`<article class="rounded-2xl bg-white shadow-sm border border-indigo-100 p-5"><div class="flex justify-between items-center"><span class="rounded-full bg-indigo-700 text-white text-xs px-3 py-1">Task ${i+1}</span>${addBtn('G-'+i)}</div><p class="mt-3 text-xs uppercase tracking-wide text-slate-500">Original sentence</p><p class="text-lg serif">${g[0]}</p><div class="mt-3 rounded-lg bg-violet-100 border-l-4 border-violet-600 p-3"><span class="text-xs uppercase tracking-wide text-violet-700 font-semibold">Your task</span><p class="font-medium text-violet-900">${g[1]}</p></div><button id="gb${i}" onclick="showG(${i})" class="mt-3 rounded-full bg-indigo-600 text-white text-sm px-4 py-1.5">Show answer</button><div id="ga${i}" class="hidden ans mt-3 rounded-r-lg p-3 text-sm"><p><b>Answer:</b> ${g[2]}</p><p class="mt-1 text-slate-700"><b>Rule:</b> ${g[3]}</p></div></article>`).join('')+`</div>`,
reading:()=>`<h1 class="text-3xl font-bold">Reading Passages</h1><p class="text-slate-600">${RD.filter(Boolean).length} of 8 passages written.</p><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-4">`+RD.map((r,i)=>`<button onclick="openRd(${i})" class="text-left rounded-xl bg-white border border-indigo-100 hover:border-indigo-400 p-4"><div class="serif font-bold text-indigo-900">${i+1}. ${r?r.t:'Passage not written yet'}</div><div class="text-xs text-slate-500 mt-1">${r?r.topic+' · '+r.qa.length+' questions':'Empty slot'}</div></button>`).join('')+`</div>`,
builder:()=>{const ids=[...sel];
  return `<div class="flex flex-wrap items-center justify-between gap-3 noprint"><h1 class="text-3xl font-bold">Test Builder</h1><div class="flex gap-2">
  <label class="text-sm flex items-center gap-2"><input type="checkbox" id="showAns" onchange="render()" ${window.showA?'checked':''}> Include answers</label>
  <button onclick="window.print()" class="rounded-full bg-indigo-700 text-white px-5 py-1.5 text-sm"><i class="fa-solid fa-print"></i> Print</button>
  <button onclick="sel.clear();count();render()" class="rounded-full border border-slate-300 px-4 py-1.5 text-sm">Clear</button></div></div>
  <div class="hidden print:block text-center border-b border-black pb-2 mb-4"><h1 class="text-xl font-bold">CBSE Class 12 English — Practice Test</h1><p class="text-sm">Name: ____________ Marks: ______</p></div>`+
  (ids.length?`<ol class="mt-4 space-y-4">`+ids.map((id,n)=>{const x=lookup(id);return `<li class="rounded-xl bg-white border border-indigo-100 p-4 print:border-0 print:p-0"><div class="flex justify-between gap-3"><p><b>${n+1}.</b> ${x.q} <span class="text-xs text-slate-500">[${x.src}]</span></p><button onclick="toggle('${id}')" class="noprint text-xs text-red-600">Remove</button></div>${window.showA?`<p class="ans mt-2 rounded-r-lg p-3 text-sm">${x.a}</p>`:''}</li>`}).join('')+`</ol>`
  :`<p class="mt-6 text-slate-500 noprint">No questions selected. Open a chapter, grammar task or passage and choose Add to test.</p>`);}
};
function render(){const a=$('showAns');if(a)window.showA=a.checked;$('view').innerHTML=V[cur]();
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.v===cur));}
function go(v){cur=v;closeDrawer();render();window.scrollTo({top:0});}
function init(){
  $('side').innerHTML=NAV.map(n=>`<button data-v="${n[0]}" onclick="go('${n[0]}')" class="navbtn w-full text-left rounded-lg px-3 py-2 text-sm font-medium hover:bg-indigo-50 flex items-center gap-3"><i class="fa-solid ${n[2]} w-4"></i>${n[1]}${n[0]==='builder'?'<span class="cnt ml-auto rounded-full bg-indigo-700 text-white text-xs px-2">0</span>':''}</button>`).join('');
  $('mobnav').innerHTML=NAV.map(n=>`<button data-v="${n[0]}" onclick="go('${n[0]}')" class="navbtn shrink-0 px-4 py-2 flex flex-col items-center gap-1"><i class="fa-solid ${n[2]}"></i>${n[1].replace('Flamingo ','')}</button>`).join('');
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
  render();count();}
init();
</script>
</body>
</html>
