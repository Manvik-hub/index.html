0:[
[`M. Hamel arrives in his green coat, frilled shirt and black silk embroidered cap, worn only on inspection or prize days. What does this choice reveal about his feelings, and how does it shape the mood of the classroom?`,
`M. Hamel's formal dress, normally reserved for inspections and prize distributions, shows that he treats his final lesson as a ceremony of honour. By dressing grandly he pays tribute to the French language and to the village children he has taught for forty years. The unusual attire also unsettles Franz, who senses that something solemn has happened. Together with the silent classroom, the village elders sitting at the back and the absence of the usual noise, the costume creates a mood of reverence and grief. Franz first suspects a holiday, but the attire turns his curiosity into dread. Thus Daudet uses clothing as a symbol: it dignifies the language, signals loss, and prepares the reader for the emotional climax when Hamel chokes and writes "Vive la France!" on the blackboard.`],
[`Franz says, "Will they make them sing in German, even the pigeons?" What does this remark show about his understanding of linguistic imperialism, and how has the lesson changed him?`,
`Franz's remark is both innocent and perceptive. Hearing that Berlin has ordered German to be taught in Alsace and Lorraine, he jokes that even the pigeons might be forced to coo in German. The humour exposes the absurdity of imposing a language on a people and hints that language is tied to identity and freedom. Earlier Franz neglected his studies, skipped lessons for birds' eggs and sliding on the Saar, and dreaded participles. After the announcement he feels shame and regret; his books, once a burden, now feel like old friends. He understands that he took the language for granted until it was snatched away. The pigeon remark therefore marks his awakening: he grasps that political domination begins by silencing mother tongues, and that learning is a privilege.`]],
1:[
[`Saheb-e-Alam, the ragpicker boy, scrounges for gold in garbage heaps of Seemapuri, and later works at the tea stall. Explain how Anees Jung uses his name and his changed circumstances to portray the loss of freedom and childhood.`,
`Saheb's name means "lord of the universe", yet he wanders barefoot in Seemapuri's garbage dumps, a refugee from Dhaka whose family lost their fields to storms. Ironically, the name highlights how poverty strips children of dignity. For him garbage is gold: he sometimes finds a rupee or even a ten-rupee note. His freedom to roam, however free from school, is illusory because it is dictated by hunger. When he joins the tea stall, he earns 800 rupees and meals, but loses even that freedom; the steel canister he carries seems heavier than the plastic bag he once carried because it is no longer his own. Jung thus shows how child labour exchanges one kind of bondage for another and robs children of play, education and identity.`]],
3:[
[`Edla Willmansson tells the peddler he may spend Christmas Eve at the Ramsjö ironworks, yet he leaves the stolen thirty kronor behind and signs himself "Captain von Stahle". What transformation does Selma Lagerlöf depict, and which events cause it?`,
`The peddler begins as a cynic who sees the world as a rattrap baited with food and shelter, tempting people into ruin. His own theft of the crofter's thirty kronor proves him right, because he becomes trapped in the forest. The ironmaster mistakes him for an old regimental comrade, but it is Edla, the daughter, who sees through him and still offers kindness and a Christmas invitation. Her trust, unlike the ironmaster's conditional charity, awakens his conscience. He returns the money, leaving a letter and a gift for her, calling himself a captain whom the world has treated badly. The story thus argues that compassion, not suspicion, redeems people, and the rattrap metaphor becomes the peddler's own self-recognition.`]],
2:[
[`Douglas nearly drowns at the Yakima YMCA pool at ten, and years later swims in the Wisconsin and Cascade lakes. How does the author overcome his fear of water, and what lesson does the essay hold about courage?`,
`At ten, Douglas is thrown into the deep end by a bully and sinks to the bottom, panicking before he kicks off the floor to surface. The terror stays for years: even the sight of water in the Cascades leaves him cold. He hires an instructor, who builds his confidence slowly, first by holding him with a rope, then by exercises that strengthen his legs, arms and breathing, until he can swim across the pool. Finally, at Meadow Lake, he conquers fear itself. The essay teaches that fear must be faced, not avoided. Douglas says that he learned to "fear nothing but fear itself", and the experience gave him a new zest for life, demonstrating how perseverance and patient training transform dread into strength.`]],
13:[
[`Charley discovers a third level at Grand Central Station and buys tickets to Galesburg in 1894. Is the third level real or a wish-fulfilment of an overstressed mind? Support your view with evidence from the story.`,
`Jack Finney leaves the question open, but strong evidence supports both views. Charley's psychiatrist friend calls the third level a waking dream, born of a mind that craves escape from anxiety, insecurity and the modern world. Yet Charley finds a first-day cover, old-style tickets, and a clerk in a straw hat, and later older money he cannot use. Sam Weiner, the psychiatrist, even vanishes, then leaves a letter: he and his wife Louisa have moved to Galesburg in 1894 after finding the third level, and Charley finds a letter of his own. Because the physical letter dated 1894 survives, the story encourages readers to believe that nostalgia, warmth and slow-paced life can feel more real than the stressful present.`]]
,
4:[[`Why does Louis Fischer treat Gandhi's refusal to leave Champaran as a turning point, and how does Rajkumar Shukla's persistence set events in motion?`,`Shukla, an illiterate peasant, follows Gandhi from Lucknow to Kanpur until he promises to visit Champaran. There Gandhi defies the order to leave, is ready for jail, and forces an inquiry. Accepting a 25 percent refund, he frees peasants from fear and shows that ordinary people can resist injustice nonviolently.`]],
5:[[`How do the make-up department and the "pancake" make-up at Gemini Studios reveal the writer's amused view of film-making in the 1940s?`,`Spender's Gemini colleagues, such as the Office Boy who dreamt of being a poet, show how wasted talent drifted into film. Make-up men treated every face with pancake and saw actors as products; the studio's chaotic, hierarchical life is observed with gentle irony.`]],
6:[[`Umberto Eco says he is a scholar who also writes novels. How does his reply to Mukund Padmanabhan challenge the usual idea of fame and the interview itself?`,`Eco explains that he works across subjects and treats his novels as a hobby, quietly refusing the label of celebrity. His humour and calm show that depth, not publicity, matters, while Silvester's debate on interviews as intrusion shows how the form shapes public image.`]],
7:[[`How does Sophie's fantasy of meeting Danny Casey differ from Jansie's and Geoff's attitude to reality in "Going Places"?`,`Sophie dreams of owning a boutique and of Danny Casey calling her, even claiming she has met him. Jansie is practical, Geoff sceptical. Her fantasy offers escape from a dull Irish home, but its collapse at the end reveals the gap between ambition and circumstance.`]],
8:[[`What contrast does Kamala Das draw between her mother's ashen face and the "young trees sprinting" outside the car, and why does she end with a smile?`,`The mother's pale, corpse-like face reflects old age and the poet's fear of losing her. Beyond the window, trees and happy children suggest life and youth. The poet hides her pain and says "see you soon", a brave smile that reassures both of them.`]],

10:[[`In "Keeping Quiet", what does Neruda mean by counting up to twelve and keeping still, and how is it different from inactivity or death?`,`Neruda wants a brief shared silence in which people stop wars, hurry and harm to nature. This stillness leads to self-reflection and unity. He insists it is not death; life goes on beneath it, as the earth does when it seems quiet.`]],
11:[[`According to Keats, how do things of beauty offset the "dark spirits" of daily life, and which examples does he give?`,`A thing of beauty never fades into nothingness; it brings sweet dreams, health and quiet breathing. The sun, moon, trees, daffodils, streams and tales of mighty dead give comfort despite gloom, and flow like an endless fountain from heaven.`]],
12:[[`How do the tigers on Aunt Jennifer's tapestry contrast with her own life, and what does the "massive weight of Uncle's wedding band" symbolise?`,`The proud tigers prance fearlessly, representing the freedom and courage Jennifer lacks. The heavy wedding band symbolises male dominance and oppressive marriage that makes her fingers tremble. Her art becomes quiet rebellion, outliving her, while she remains terrified.`]],
14:[[`How does the Maharaja of Pratibandhapuram, Jung Bahadur, try to defy the prophecy about his death, and how does it still come true?`,`He kills 99 tigers, bans tiger hunts by others and even marries into a family with many tigers. At his son's birthday he buys a wooden toy tiger for the hundredth; a splinter pricks his hand, the wound festers and he dies, mocking human pride.`]],
15:[[`What does Tishani Doshi's account of Antarctica, with Gondwana and Goa, teach about climate change and human responsibility?`,`Tishani Doshi describes an icy continent whose rocks show Goa was once joined to it, and ice cores that record Earth's past. She warns that melting ice and pollution threaten the planet, so students of nature must protect it.`]],
16:[[`Why does Dr. Sadao Hoki shelter the American prisoner Tom despite his duty as a Japanese patriot, and how do Hana and the General respond?`,`Sadao, trained in Boston, cannot turn away a dying man. He treats Tom's wounds, hides him and finally arranges his escape by boat. Hana helps, though reluctantly, while the General, needing Sadao, protects him; humanity overcomes national hatred.`]],
17:[[`How does the friendship between Mr. Lamb and the burnt boy Derry in "On the Face of It" help Derry accept himself?`,`Derry hides from people because of his burnt face. The old man with a tin leg welcomes him into his garden, where he learns that people are not just faces. Lamb's death leaves him determined to face the world, not hide.`]],
18:[[`How does Zitkala-Sa's loss of her long hair in the mission school reveal the cruelty of forced cultural assimilation?`,`In her culture only cowards and mourners cut their hair. Hiding under the bed, she is dragged out and shorn, feeling like a "little animal driven by a herder". The incident shows how institutions stripped Native children of identity and dignity.`]]

3:[[`How do the ironmaster's and Edla's behaviour toward the peddler differ, and why does the author contrast them?`,`The ironmaster is hasty, mistaking him for Captain von Stahle, and is angry when the truth emerges. Edla, thoughtful and gentle, still welcomes him. The contrast shows that superficial charity is weaker than genuine, understanding kindness.`]],
4:[[`What constructive work did Gandhi organise in Champaran beyond the legal inquiry, and why did he consider it vital?`,`Gandhi opened village schools with volunteers, taught hygiene, and engaged a doctor with Kasturba's help. He believed that political freedom needed social improvement and self-reliance, so peasants would not depend on any outsider.`]],
5:[[`What was the role of Kothamangalam Subbu at Gemini Studios, and how did the poets and the "Legal Adviser" add to its odd atmosphere?`,`Subbu was Vasan's chief of story department, a poet and a generous man who wrote comic verses. The Legal Adviser, who wore a coat and sat unused, was paid to fight no cases. The staff reveal the studio's relaxed, quirky creative world.`]],
6:[[`How does Rudyard Kipling's resentment of interviews, cited by Silvester, support the view that interviews can intrude on privacy?`,`Silvester recalls Kipling calling interviews immoral and a crime. Others like Lawrence felt it stole a part of the soul. The comparison shows that opinion on the interview as an art form is divided between truth-seeking and intrusion.`]],
7:[[`What does the closing scene, in which Sophie waits by the bridge for Danny, suggest about the power and limit of fantasy?`,`Sophie imagines the meeting so intensely that she waits in vain. The silent ending shows her longing and loneliness, and warns that dreams without action cannot change reality.`]],
8:[[`What is the effect of the simile "pale as a late winter's moon" and of the "old familiar ache" in the poem's ending?`,`The moon simile shows the mother's lifeless, fading face, hinting at ageing and death. The "childhood fear" returns, and the poet's smile hides fear, linking the opening car-window image with the closing farewell.`]],

10:[[`What examples of destructive human activity does Neruda list in "Keeping Quiet", and what alternative does he suggest?`,`He speaks of fishermen harming whales, men gathering salt who see their hurt hands, and wars with gas and fire. Silence and togetherness would let us pause and think of preserving life instead.`]],
11:[[`What does Keats mean by saying that beauty weaves "a flowery band to bind us to the earth"?`,`The image says that beauty ties human beings to life despite sorrow, gloom and disappointment. Nature, stories of noble heroes and daily joy form a bond that lifts the human spirit.`]],
12:[[`What do the words "sleek" and "chivalric certainty" suggest about the tigers, and how do they differ from Jennifer's fear?`,`Sleek and chivalric show confidence, grace and fearless honour. The tigers walk unafraid beneath green trees, while Jennifer's fingers can barely pull the needle, showing her suppressed life.`]],
14:[[`What part does the Dewan play in the Tiger King's story, and how does his advice sustain the Maharaja's obsession?`,`The Dewan flatters the ruler and cleverly arranges tigers to be brought, including the final hunt. He is torn between loyalty and fear of the King's anger. His submission highlights the flattery that encourages tyranny.`]],
15:[[`What does Doshi mean by describing the Drake Passage and the continent as the "earth's memory", and how does it link past and future?`,`The ice cores and rocks hold records of the planet's temperature and gases. Understanding them helps people predict the climate, so Antarctica is both a scientific archive and a warning.`]],
16:[[`How do the servants and Hana react to the wounded prisoner, and what do their attitudes show about wartime hatred?`,`The servants leave because they fear punishment and distrust the foreigner. Hana at first recoils, then helps with cloth and water. Their reactions show prejudice created by war that compassion has to overcome.`]],
17:[[`How does Mrs. Dasgupta's attitude and the boys who throw stones at Derry reveal the cruelty of society toward a disfigured person?`,`Derry says that people stare, mock and avoid him, and even his mother cannot see him without grief. This hostility explains his bitterness and why Lamb's open friendship matters so much.`]],
18:[[`How does Bama discover untouchability, and what advice does her elder brother give that changes her life?`,`She sees an elderly man carry curry in a packet by its string for the landlord, and her brother explains caste. He tells her to study hard to earn respect, which makes her a top student and later a Dalit writer.`]]

[`What temptations nearly kept Franz from school that morning, and what does his decision to go show?`,`The warm weather, the chirping blackbirds and Prussian soldiers drilling in the field tempted him to skip. Resisting them, he went, though in fear of Hamel's questions on participles, unknowingly attending the final French lesson.`],
[`What did Franz see at the town hall notice board, and how did the blacksmith Wachter's remark mislead him?`,`A crowd stood before the bulletin board, which carried bad news for two years. Wachter told him not to hurry, as he would reach school in time. Franz thought it a joke, unaware of the real order.`],
[`Why does Franz find the unusual silence of the classroom startling?`,`Usually the school hummed with desks opening, lessons repeated aloud and Hamel's ruler rapping. That morning it was calm like a Sunday, so Franz expected punishment for lateness and felt embarrassed.`],
[`How does M. Hamel receive Franz when he enters late, and what does this kindness signify?`,`Instead of scolding, Hamel gently asks him to take his seat, saying they had nearly begun without him. His soft tone shows that this day is special and that strict discipline has given way to affection.`],
[`What announcement does Hamel make about the order from Berlin, and how does it affect the pupils?`,`He says only German will be taught in the schools of Alsace and Lorraine, and the new master comes tomorrow. The pupils are stunned, and Franz feels sorry for wasted time and ashamed.`],
[`Why does Franz say his books now feel like "old friends", and what change in his outlook does this indicate?`,`The grammar and sacred history books were burdens he wanted to leave. Faced with parting from them, he sees their value. He moves from careless boyhood to understanding of what learning and language mean.`],
[`Why does Franz fail to recite the participle rule, and what does the failure teach him?`,`He confuses the rule and stands tongue-tied, head hanging. Hamel does not scold, but blames everyone for postponing study. Franz learns that putting things off can lead to irreparable loss.`],
[`How does Hamel describe the French language, and what does he urge the villagers to do with it?`,`He calls French the clearest, most logical and most beautiful language. He urges them to guard it among themselves and never forget it, because a people holding their language hold the key to their prison.`],
[`Explain Hamel's idea that holding fast to one's language is like having "the key to their prison."`,`Language carries culture, memory and identity. Even enslaved people who keep their language can resist assimilation and one day regain freedom, because the conqueror cannot erase what lives in their speech.`],
[`How do the copy slips reading "France, Alsace, France, Alsace" hanging from the desk rods express patriotism?`,`Hamel had prepared new copies with the names of the lost region, flying like little flags around the room. The slips show the pupils working to write their motherland's name, a quiet pledge of loyalty.`],
[`How does Daudet use the worn benches, walnut trees and hop vine to show Hamel's attachment to the school?`,`Hamel has watched the benches wear, the walnuts grow and the hop vine climb to the windows. His sorrow at leaving them, and his sister's packing upstairs, reveal forty years of devoted routine.`],
[`What is the significance of the church clock striking twelve and the Prussian trumpets during the final lesson?`,`The clock marks the end of an era and the trumpets announce the returning Prussian soldiers, symbols of the conqueror's arrival. The sounds interrupt Hamel and heighten the story's emotional climax.`],
[`How does Franz's view of Hamel change from fear to admiration during the lesson?`,`Franz once feared the ruler and temper. Now he forgets the ruler and pitiable manner, and realises Hamel is leaving after forty years. He admires his patience and wants to make up for being a lazy pupil.`],
[`Why does Hamel write "Vive la France!" on the blackboard, and why does he lean against the wall?`,`Choked with emotion, he cannot speak, so he writes the cry of loyalty in big letters. Leaning his head on the wall, he gestures dismissal, a silent farewell expressing grief and love of country.`],
[`How is the theme of language and freedom developed across the story?`,`Berlin's order, Hamel's praise of French, the pigeons joke and "the key to their prison" together show language as identity. Daudet argues that suppression of a language is political domination.`],
[`How do the village elders, such as the former mayor and the postmaster, add to the mood of the last lesson?`,`The old men, with triangular hats and primers, sit on the back benches and weep as they join in the lesson. Their presence makes the occasion a community mourning and shows shared regret for neglected learning.`],
[`Does Daudet suggest that the villagers share the blame for neglecting French? Support your answer from the story.`,`Yes. Hamel says parents were anxious to put children to work, and he himself used them for gardens and fishing. Everyone postponed learning, so everyone loses it too late.`]

[`Why did the ragpickers' families leave Dhaka for Seemapuri, and how do they live there?`,`Storms swept away their fields and homes in Bangladesh, so they migrated to Delhi in 1971. They live in mud hutments with roofs of tin and tarpaulin, without sewage or drinking water, surviving on garbage.`],
[`What does the incident of Saheb's tennis shoes reveal about his longing and about social inequality?`,`He wears discarded tennis shoes with holes, a rich boy's cast-offs, yet is delighted. Peering through a fence at a tennis court, he says he plays only when the gate is open, showing that games belong to the privileged.`],
[`How does the narrator respond when Saheb asks about school, and what does his reaction show?`,`When she suggests he go to school, he says there is none in his neighbourhood. When she jokes she will open one, he asks if she will really do it. Later he reports that he has joined and the writer realises it was an empty promise.`],
[`Why does the writer say that garbage is "gold" to the ragpickers and a means of survival to their parents?`,`For children, garbage may bring a coin or a rupee note, a surprise that feels like treasure. For parents it is bread. Anees Jung exposes how poverty can transform filth into hope.`],
[`Describe the working conditions of the glass-bangle workers in Firozabad.`,`Families work in dark, poorly ventilated hutments, before hot furnaces with high temperatures, joining glass rings. Children often lose eyesight before they become adults, since they work in dim light.`],
[`What does Savita, the girl in the faded pink dress, symbolise in the Firozabad episode?`,`Savita sits with a bangle-welder and works mechanically, unaware that bangles symbolise marriage and happiness. She stands for children who make bridal ornaments but do not know any joy themselves.`],
[`How does the idea of caste and destiny, "karam", trap Mukesh's family and neighbours in the bangle trade?`,`Mukesh's grandmother believes bangle-making is their karam, God-given lot. Born in the caste of bangle makers, they accept it and never dream otherwise, so poverty continues for generations.`],
[`Who forms the "vicious circle" that keeps the Firozabad workers poor, and how?`,`Sahukars, middlemen, the police, bureaucrats and politicians exploit them. Moneylenders trap families in debt, and officials block any cooperative. Thus bangle makers are stuck in poverty.`],
[`Why can the bangle makers of Firozabad not organise themselves into a cooperative?`,`They fear being beaten and jailed by the police, who side with moneylenders. Years of exploitation have also left them without leadership or courage, so any attempt at organising collapses.`],
[`What is the significance of the title "Lost Spring"?`,`Spring symbolises childhood and promise. For Saheb and Mukesh, it is lost to labour and poverty. The title laments the death of play, education and hope for millions of child workers.`],
[`Why do the ragpickers lack identity papers, yet hold ration cards, and what does this paradox suggest?`,`They have no permits or documents to prove citizenship, but ration cards let them get grain and vote. The writer shows that their food matters more to authorities than their rights.`],
[`How does Anees Jung explain the bare feet of children as a "tradition", and why is she unconvinced?`,`Some say it is a tradition to go barefoot, but she sees that it is an excuse for poverty. She suspects the reason is a lack of money, and tradition becomes cover for neglect.`],
[`How does the author contrast the glitter of bangles with the grim lives of the workers who make them?`,`Colourful bangles of every shade are the pride of Indian brides, yet the makers live in squalor and darkness. The contrast between beauty and misery underlines the cruelty of exploitation.`],
[`Why does the writer say that the young of Firozabad are "born in debt" and "their spirit is crushed"?`,`Generations inherit debt along with the trade, so they know nothing else. Fear of the system and the lack of vision make them lose spirit, and the cycle of poverty continues.`],
[`How does the story show the failure of child-labour laws in India?`,`Although children working in hazardous furnaces is illegal, thousands do so openly. Police and officials look away, showing that laws mean little without enforcement and welfare.`],
[`Identify two images in "Lost Spring" that convey poverty vividly, and explain their effect.`,`"Roofs of tin and tarpaulin" and "mounds of garbage" evoke a landscape where dignity is absent. These images give readers a concrete sense of the children's world.`],
[`How does the writer use irony in the names Saheb-e-Alam, Mukesh and Savita?`,`Saheb-e-Alam means lord of the universe, though he is a rag-picking beggar. Mukesh and Savita bear names of ordinary ones without hope. Irony underlines the gap between promise and reality.`],
[`Compare the two parts of the chapter: how are Saheb's and Mukesh's situations similar and different?`,`Both lose childhood to work. Saheb is a migrant ragpicker with some freedom who then becomes a servant, while Mukesh is a native of Firozabad bound by caste and tradition, yet dreaming of becoming a mechanic.`]
]

[`How did the wave at Oregon beach and his mother's warnings plant Douglas's fear of water in childhood?`,`At about three or four, a big wave knocked and frightened him at the Oregon beach. His mother's caution about drowning also left him timid and anxious around water.`],
[`What plan did Douglas make at the bottom of the YMCA pool, and why did it fail twice?`,`He planned to land on the floor, spring up like a cork and paddle to the edge. Terror and lack of air made each attempt fail, and he lost hope.`],
[`How did fear of water spoil Douglas's fishing and canoeing trips in the Cascades and Bear Creek?`,`He loved trout streams but felt terror even when wading or canoeing. The memory of drowning rose each time, so the outdoors lost its joy.`],
[`Describe the instructor's method of training Douglas in the pool.`,`The instructor tied a rope round Douglas's waist, with a pulley, and kept him afloat. He taught him to put his face in the water, exhale, kick and then use his arms, over months.`],
[`Why was the instructor's patience important for Douglas's recovery?`,`Douglas still panicked in the water for weeks. The instructor kept practising each skill separately, so Douglas gradually built confidence, one muscle at a time.`],
[`What happened when Douglas tested his skill alone at Lake Wentworth?`,`He swam out and felt panic once more, but he forced himself to continue. The test taught him that the fear was in his mind, and that he could still move.`],
[`How does Douglas use Roosevelt's idea of fearing "nothing but fear" in the essay?`,`Facing death in the pool taught him that the paralysis of fear was worse than danger. By confronting it, he reaches the confidence that he could feel at ease.`],
[`Why is the title "Deep Water" both literal and symbolic?`,`Literally it is the pool's deep end that nearly kills him. Symbolically it stands for life's fears and hardships, which one must face to feel the joy of life.`]
],
3:[
[`What is the peddler's "rattrap" philosophy about the world, and how does the story prove it wrong?`,`He thinks the world baits people with food, shelter and warmth, then traps them. Edla's kindness proves otherwise, as trust frees him.`],
[`How does the old crofter treat the peddler, and how does the peddler repay him?`,`The crofter gives him porridge, tobacco and a night's rest, and shows his thirty kronor. The peddler steals the money, showing his cynicism.`],
[`Why does the peddler feel trapped in the forest after the theft?`,`Wandering without finding the road, he sees himself as a rat caught in the trap. His fear shows that the world's temptation had caught him.`],
[`What role does the blacksmith at the Ramsjö ironworks play in the plot?`,`The blacksmith lets the peddler warm himself in the forge at night without asking questions. His casual welcome brings him into the ironmaster's attention.`],
[`Why does the peddler refuse the ironmaster's invitation but accept Edla's?`,`The ironmaster mistakes him for an old comrade and gives orders, so he fears exposure. Edla's gentle, sincere persuasion makes him feel safe and respected.`],
[`How does the peddler repay Edla's kindness on Christmas morning?`,`He leaves the stolen thirty kronor with the crofter's pouch hanging on the window, and presents a rattrap as a Christmas gift.`],
[`What does the letter that comes with the rattrap show about the peddler's change?`,`He writes that he was a rat who was tempted, and wants the money returned. Signing himself Captain von Stahle shows new dignity and self-respect.`],
[`How does the author use the rattrap as a framing image from beginning to end?`,`The story starts with the peddler selling rattraps and ends with a rattrap as a gift. The image moves from cynicism to gratitude and redemption.`]
],
4:[
[`How does Rajkumar Shukla's appearance and background contrast with his determination to bring Gandhi to Champaran?`,`He was a poor, emaciated, illiterate peasant, yet he followed Gandhi everywhere until he promised to visit Champaran. His simple persistence started the whole movement.`],
[`What was the tinkathia system, and why were the peasants unhappy with it?`,`Landlords forced tenants to plant 15 percent of their land with indigo and surrender the whole crop as rent. It left peasants poor and unable to grow food.`],
[`How did the lawyers at Muzaffarpur react to Gandhi's arrival, and what did he tell them?`,`They explained that they took only poor peasants' fees and were afraid. Gandhi told them to set aside fear, as the peasants were crushed by fear.`],
[`Why did the landlords suddenly agree to refund part of the money after synthetic indigo came to market?`,`Germany developed synthetic indigo, so the natural crop lost value. The landlords tried to get the peasants to pay compensation, but peasants demanded refunds.`],
[`How did Gandhi respond when ordered to leave Champaran, and what was the court's reaction?`,`He disobeyed the notice and was prepared for jail. Surprised, the magistrate postponed the case and the government dropped the charge.`],
[`Why did Gandhi accept a refund of only 25 percent?`,`He said the amount mattered less than the fact that landlords had been forced to surrender part of what they had taken wrongfully.`],
[`Why did Gandhi refuse the offer of Charles Freer Andrews's help in Champaran?`,`He felt Indians must learn self-reliance and not rely on an Englishman. Depending on outsiders, he said, would weaken the lesson of the movement.`],
[`What was the main lesson of the Champaran struggle for Indians, according to Fischer?`,`It freed them from the fear of British power. The peasants realised that courage and unity could challenge injustice and made freedom seem possible.`]
],
8:[
[`What is the setting of "My Mother at Sixty-six", and where is the poet going?`,`The poet drives to Cochin airport with her mother, who sits beside her in the car. The long road suggests the approach of parting.`],
[`Why does the poet turn her gaze away from her mother to the world outside the car?`,`Seeing her mother's pale face fills her with fear and pain. Looking outside offers relief, but the contrast only increases her anxiety.`],
[`What does the mother's dozing "open mouthed" suggest about ageing?`,`It suggests weakness, helplessness and nearness to death. The poet notices it as the sign of her mother's frailty.`],
[`Why does the poet recall the airport security check as the car stops?`,`The security check marks the formal parting. It makes her look back at her mother's pale face and the fear returns just before the farewell.`],
[`Why does the poet repeat the word "smile" at the end?`,`The repetition shows effort. She masks her sorrow, and comforts her mother, while hiding her own anguish.`],
[`What do "young trees sprinting" and "merry children spilling out of their homes" represent?`,`They stand for energy, youth and the joy of life. The contrast with her mother's drained face makes the sense of ageing sharper.`],
[`What is the poet's "childhood fear", and why does it resurface now?`,`As a child she feared losing her mother. Seeing her pale and old at sixty-six revives the fear that she may not see her again.`],
[`How does the poem move from fear to reassurance in its final lines?`,`It begins with the pale face and pain, but ends with a parting "see you soon, Amma" and a smile, hiding fear with love and hope.`]
],
9:[
[`What does the roadside stand symbolise in Robert Frost's poem, and how does it highlight the condition of the rural poor?`,`The roadside stand symbolises the modest hopes and economic struggle of country people who offer their produce to passing city traffic. It highlights their isolation, poverty and the indifference of an urban world that rarely stops to buy.`],
[`How does the poet describe the "polished traffic" and what does this reveal about the attitude of city people?`,`The "polished traffic" refers to the shiny cars of well-off city dwellers that speed past the stand. It reveals their indifference and selfishness; they either ignore the vendors or stop only to complain that the stand spoils the scenic view.`],
[`Explain the significance of the phrase "the sadness that lurks near the open window."`,`This phrase captures the quiet disappointment of the people waiting at the stand. They sit by the open window hoping a car will stop, but their sadness comes from the repeated failure of the traffic to notice or buy from them.`],
[`What is the "childish longing" of the country folk, and why does Frost call it childish?`,`The childish longing is their simple, innocent hope that city people will stop, buy something and bring them a little money and a taste of urban life. It is called childish because it is naive and unrealistic in the face of urban indifference.`],
[`How does Frost criticise the "greedy good-doers" in the poem?`,`The greedy good-doers are politicians and planners who propose to move the rural poor to cities, claiming it is for their benefit. Frost sees them as self-serving, more interested in clearing the countryside for their own comfort than in truly helping the poor.`],
[`What contrast does the poem draw between the countryside and the city?`,`The countryside is shown as a place of natural beauty mixed with poverty and patient waiting. The city is linked with wealth, speed and polished cars that show no concern for the people by the road, underlining a deep rural-urban divide.`],
[`Why do the cars stop at the stand only briefly, according to the poet?`,`They stop only to ask for directions or to complain that the stand and its signs spoil the beauty of the landscape. They do not stop to purchase, showing that their concern is aesthetic rather than human.`],
[`How does the title "The Roadside Stand" reflect the central theme of the poem?`,`The title focuses on the humble commercial effort of the rural poor. It reflects the themes of unfulfilled hopes, economic disparity and the failure of the urban world to respond to rural need.`],
[`What is the poet's attitude towards the people who set up the roadside stand?`,`The poet is deeply sympathetic and pained by their situation. He feels their disappointment as his own and expresses anger at a system that ignores their simple longing for a better life.`],
[`Explain the irony in the lines about the rural poor being "bought out and mercifully gathered in."`,`The word "mercifully" is ironic. The plans to relocate the poor are presented as kindness, but Frost suggests they serve the interests of others who wish to remove the poor from the landscape rather than improve their lives where they are.`],
[`How does Frost use the imagery of the stand and its goods to evoke sympathy?`,`He mentions wild berries and crook-necked golden squash, simple natural products. The humble goods and the figures waiting beside them create a picture of innocence and need that invites the reader's pity.`],
[`What does the poet mean by the fear that the countryside will spoil "the flower of cities"?`,`He sarcastically suggests that city people worry the rural stand and its people will somehow damage the beauty or comfort of urban life, revealing their superficial and self-centred concerns.`],
[`In what way does the poem critique the idea of progress?`,`The poem criticises progress that benefits only the city while leaving the rural poor behind or forcibly relocating them. True progress, Frost implies, should not come at the cost of the dignity and home of country people.`],
[`How does the ending of the poem express the poet's frustration?`,`The ending shows the poet's rage and helplessness. He wishes he could somehow relieve their pain or that the "greedy good-doers" would simply leave the people alone, ending on a note of compassionate anger.`],
[`What role does trust play in the poem, and how is it repeatedly broken?`,`The rural people trust that city folk will stop and support them by buying their produce. This trust is broken again and again as cars pass without stopping, leading to disappointment and a sense of betrayal.`],
[`Describe the setting of the poem and its contribution to the mood.`,`The setting is a quiet country road with a simple wooden stand. The contrast with the rushing polished cars creates a mood of stillness, patient waiting and melancholy.`],
[`How does Robert Frost's use of the first-person voice engage the reader?`,`By speaking as "I" who feels the sadness near the window, Frost makes the reader share the emotional burden of the rural people's plight, turning observation into personal concern.`],
[`What is the significance of the "N" and "S" signs on the stand?`,`The signs pointing North and South show the rural people's attempt to be helpful and attract traffic. Ironically, even this small service is ignored or resented by the city drivers.`],
[`How does "The Roadside Stand" reflect Frost's concern for the marginalised?`,`Frost, who often wrote about rural life, shows deep concern for the economic and emotional marginalisation of country people in an increasingly urbanised world that passes them by.`],
[`What message does the poem convey about human connection and indifference?`,`The poem suggests that true human connection requires noticing and supporting those who wait by the road. Indifference, shown by cars that never stop, is a quiet form of cruelty.`]
],10:[
[`What does Neruda mean by asking us to "keep still" and not speak "in any language"?`,`He asks for a moment of shared silence free of division, so people can reflect together without national or linguistic barriers.`],
[`What does the "huge silence" stand for in the poem?`,`It stands for introspection and peace. This pause might end the sadness of never understanding ourselves or each other.`],
[`What picture of the salt gatherer does the poet draw, and what does it suggest?`,`The man gathering salt looks at his hurt hands, which suggests exploitation and suffering. A pause would let him see his pain.`],
[`How does the poem envisage "green wars" ending?`,`The men who prepare wars with gas and fire would put on clean clothes and walk with their brothers in shade, doing nothing, and so wars would stop.`],
[`Why does Neruda say "what I want should not be confused with total inactivity"?`,`He wants a thoughtful pause, not idleness or death. Quiet reflection, he suggests, is the start of renewal and care.`],
[`What does the poet learn from the earth when "everything seems dead"?`,`The earth appears lifeless in winter and later shows life. Silence and stillness, likewise, can lead to renewal and understanding.`],
[`Why does the poet use "we" and "let's" instead of "you"?`,`The first person plural makes the invitation inclusive. He joins all humanity in a collective effort for peace.`],
[`How do the tone and structure of "Keeping Quiet" reflect its message?`,`The tone is gentle and calm, with the countdown to twelve and short lines imitating a pause. Its simple, unhurried structure invites reflection.`]
],
11:[
[`What does "A thing of beauty is a joy for ever" mean in the opening line?`,`Beauty never loses value and never fades into nothingness. Its joy grows with time, giving lasting pleasure.`],
[`What gifts does a thing of beauty bring, according to "quiet breathing" and "sleep full of sweet dreams"?`,`It brings calm, health and peaceful sleep. Beauty soothes the mind and body, and so keeps us serene.`],
[`What is meant by "the inhuman dearth of noble natures"?`,`It refers to the lack of noble, generous people in the world. This gloom is lifted by beauty that inspires hope.`],
[`Which natural objects does Keats name as examples of beauty, and why?`,`He lists the sun, moon, young and old trees, daffodils and clear rills. All give shade, joy and freshness, brightening everyday life.`],
[`How does the "mid-forest brake" and musk-rose imagery add to the poem's picture of nature?`,`The cool, shaded forest and sweet-scented musk-rose blooms show the quiet richness of nature, which comforts the mind.`],
[`What does Keats mean by "the grandeur of the dooms we have imagined for the mighty dead"?`,`The noble stories of heroes inspire us. Their courage and sacrifice also form beauty that uplifts our spirits.`],
[`Why does Keats call beauty an "endless fountain of immortal drink"?`,`Like a fountain flowing from heaven, beauty never dries up and constantly refreshes human hearts with joy.`],
[`How does the poem reflect Romantic ideals about nature and imagination?`,`It praises nature as a healing, uplifting force and celebrates imagination's tales. Beauty is shown as a comfort to every suffering human being.`]
],
12:[
[`How does Rich describe the tigers as "bright topaz denizens of a world of green"?`,`The tigers appear glowing like jewels, at home in a lush forest. The colours convey a freedom and vitality that Jennifer lacks.`],
[`What does "They do not fear the men beneath the trees" show about the tigers?`,`They are bold, strong and free of human fear. The contrast with Jennifer's timid life reveals her suppressed wish for courage.`],
[`Why does Jennifer find the ivory needle "hard to pull"?`,`Her fingers tremble with fear and her heavy wedding ring weighs them down. The effort of embroidery shows her oppression.`],
[`What is implied by "ringed with ordeals she was mastered by"?`,`Her married life is a series of trials in which she was controlled. The ring suggests bondage rather than love.`],
[`What do the tigers symbolise in the poem?`,`The tigers symbolise courage, freedom and the desires she cannot express. Her art becomes a silent rebellion against patriarchy.`],
[`What happens to the tigers after Aunt Jennifer's death?`,`The tigers continue to prance proudly and unafraid, though she is dead. Art outlives her suffering and keeps her spirit alive.`],
[`What poetic devices does Rich use, and how do they shape the poem?`,`Contrast, imagery, alliteration and symbol sharpen the opposition between tigers and Jennifer. Short rhymed stanzas make the poem crisp and pointed.`],
[`How does the poem comment on women's position in marriage?`,`Aunt Jennifer is terrified and weighed down by Uncle's ring, while her art expresses her longing. The poem protests against male dominance in marriage.`]
]
};

const LIT5={
13:[
[`How does Charley happen to reach the third level of Grand Central, and why does he first doubt it exists?`,`Hurrying through the station, he takes a wrong turn down a ramp and finds a strange low-ceilinged level. Afterwards he cannot find it again, so he doubts it.`],
[`What differences does Charley notice between the third level and the rest of the station?`,`The place is lit by older lamps, staffed by clerks in old-style clothes, and a newspaper is dated 1894. These details make it feel like another century.`],
[`How does the ticket clerk react to Charley's money, and why?`,`The clerk is suspicious of the unfamiliar large notes, since the third level uses old currency. Charley cannot buy tickets, which shows that he has strayed into the past.`],
[`Why is Galesburg, Illinois, so attractive to Charley?`,`It is a quiet, peaceful small town of 1894, with leisurely life and neighbours who care. It is the opposite of the tense and hurried present.`],
[`What role does Louisa, Charley's wife, play in the story?`,`She is a calm, worried listener who shares Charley's wish for a gentler life. Her willingness to move with him later shows how real the idea has become.`],
[`How does the narrator's hobby of collecting stamps connect him with the third level?`,`His collection includes first-day covers, which show how closely the past is tied to his imagination. It also provides the final clue in the letter.`],
[`Why does Sam Weiner's psychiatric view of the third level fail to convince Charley?`,`Sam says it is a waking dream caused by worry, but Charley feels the details were too sharp to be imagined. The doubt continues until the letter comes.`],
[`What is the importance of the letter from Sam postmarked 1894?`,`Sam reveals he and Louisa have settled in Galesburg, which can be true only if the third level exists. The letter gives physical evidence against the psychiatrist's own theory.`],
[`How does the title "The Third Level" suggest more than a place?`,`It suggests a hidden level of the mind, a refuge from pressure. It symbolises nostalgia and the wish to escape into a simpler world.`],
[`What does the story say about the stress of modern life?`,`Charley's anxiety, his daily rush and the grim war news show strain. The story suggests that people dream of calm places like Galesburg.`],
[`How does Jack Finney make a fantasy story feel realistic?`,`He uses a first-person narrator, everyday detail about stamps and money, and a sceptical friend. These choices make readers accept the improbable.`],
[`Why does Charley keep trying to find the third level again?`,`He longs to escape and begins to search each time he passes, but never finds it. His failure keeps the mystery alive.`],
[`How would you describe the tone of the story?`,`It is conversational, wistful and gently humorous. The tone makes the strange experience seem natural and invites the reader's sympathy.`],
[`What is the central message of "The Third Level"?`,`People long for a simpler, happier life. The story suggests that imagination and nostalgia help us bear the pressures of the present.`]
],
14:[
[`Who is the Tiger King and how did he get the name?`,`He is the Maharaja of Pratibandapuram, Jilani Jung Jung Bahadur, called Tiger King because he was born to be killed by a tiger and then vowed to kill tigers.`],
[`What did the astrologer predict at the Maharaja's birth, and how did the court react?`,`He said the child would grow up to be famous and would die from a tiger. Hearing that, the people were alarmed and the king decided to remove the danger.`],
[`How does the young Maharaja respond to the prophecy?`,`He grows up determined to kill tigers and began hunting early, treating the prophecy as a challenge to beat fate itself.`],
[`Why does the Maharaja ban tiger hunting for everyone else in his state?`,`He wants every tiger for himself so that he can finish his count of hundred. Anyone who disobeys is punished.`],
[`How does he treat the British officer who asks for a hunting licence?`,`He refuses, and threatens the officer with punishment. His action shows pride and a willingness to defy even the colonial power.`],
[`How does the administration revolve around the Maharaja's obsession?`,`Officials, the Dewan and the staff arrange tigers and shoot-outs. Normal government gets neglected, and the tale satirises misuse of royal power.`],
[`What problem arises as the Maharaja's tiger count approaches a hundred?`,`The state's tigers run out. He is frustrated and the Dewan has to find or import tigers to satisfy him.`],
[`What role does the Dewan play in keeping the king happy?`,`He flatters, makes secret arrangements and obeys orders out of fear. His actions show how courtiers feed a tyrant's vanity.`],
[`How does the story change when the Maharaja misses the hundredth tiger?`,`His hope of defying fate wavers. The failure makes him anxious, so the story shifts from boastful comedy to irony and tension.`],
[`Why is the death by a wooden toy tiger ironic?`,`He killed ninety-nine real tigers, but a splinter from a toy bought for his son's birthday kills him. The prophecy is fulfilled in a trivial way.`],
[`What ecological message does Kalki's story carry?`,`The killing of tigers for vanity shows how human arrogance destroys wildlife. The story warns that cruelty to nature brings tragedy.`],
[`Which satirical techniques does the writer use in the story?`,`Exaggeration, irony and deadpan humour are used. The tone is mock-serious, so the follies of rulers and flatterers are laughed at.`],
[`Write a character sketch of the Maharaja.`,`He is proud, stubborn, tyrannical and superstitious. His fixation on beating fate shows courage and foolishness, and he is a comic yet pitiable figure.`]
],
16:[
[`How does the setting near the sea and the hospital shape the opening of "The Enemy"?`,`Dr. Sadao's house stands on a quiet Japanese shore, near a private hospital. The isolated setting allows the secret rescue and builds suspense.`],
[`How has Sadao's training in America influenced his outlook?`,`He studied medicine in the United States, where he learned scientific care and respect for life. This shapes his decision to treat a foreigner.`],
[`How does Sadao react when he first sees the wounded man on the beach?`,`He first feels anger, thinking of the enemy. His training as a doctor, however, makes him help a human being in need.`],
[`Why is Sadao not sent to war and kept at home?`,`He is needed by the old General, who suffers from a painful illness. Sadao's research on treating him keeps him in Japan.`],
[`How does Sadao treat the prisoner's wound, and what does this show?`,`He removes the bullet from the man's back at home with Hana's help. It shows professional skill and compassion beyond national loyalty.`],
[`How does Hana's character develop in the story?`,`She at first shrinks from the white man's blood and fears the servants. Gradually she helps with care, showing courage and kindness.`],
[`Why do the servants leave the house after the prisoner arrives?`,`They fear punishment for harbouring an enemy and are suspicious of foreigners. Their desertion makes the couple handle the crisis alone.`],
[`What does Sadao decide to do with the prisoner, and why?`,`He first thinks of reporting him but cannot let him die. He keeps him in the house, then allows him to escape.`],
[`How does the General respond when Sadao tells him about the prisoner?`,`The General promises to send assassins to deal with the prisoner but forgets as he needs Sadao's treatment. His selfish concern outweighs duty.`],
[`How does Sadao eventually help the prisoner escape?`,`He gives him a boat, food and directions to an island. He warns Tom to leave quickly, putting humanity above patriotism.`],
[`What conflict does Sadao face between duty as a patriot and duty as a doctor?`,`As a Japanese he should hate the enemy, but as a doctor he must heal anyone. The story resolves it in favour of humanity.`],
[`How does the story show the cruelty and absurdity of war?`,`It shows how war breeds hatred and suspicion even among ordinary people. Sadao's and Hana's kindness stands out against it.`],
[`Why is the title "The Enemy" ironic?`,`The man called an enemy is only a wounded human being. The real enemies are the hatred and prejudice that war creates.`]
],
17:[
[`How does the wild garden of Mr. Lamb contrast with Derry's gloomy world?`,`The garden is full of fruit, flowers and wildness, offering life and freedom. It contrasts with Derry's isolation and acts as a place of healing.`],
[`Why does Derry hesitate at first to enter Mr. Lamb's garden?`,`He has been teased about his burnt face and fears yet another rejection. Mr. Lamb's open invitation surprises him.`],
[`What is the significance of Mr. Lamb's tin leg?`,`It shows that he too has a physical difference. His casual attitude to it teaches Derry that handicaps need not bring shame.`],
[`How does Mr. Lamb respond when Derry complains about his face?`,`He listens and says people also fear and avoid him in other ways. He suggests that Derry should not hide.`],
[`How does Mrs. Dasgupta's reaction show a different kind of cruelty from the children's?`,`Her pity, though kind, still makes Derry feel different. The story shows that pity can hurt just as mockery does.`],
[`How does Derry's mother treat him, and why is that unhelpful?`,`She protects him and keeps him away from others, which deepens his isolation. He needs encouragement to face the world.`],
[`What does Mr. Lamb say about the "burden" people place on others?`,`He suggests that people should not make their own pain or fears an excuse to avoid others. Derry must help himself and mix.`],
[`What do the apples and the garden symbolise in the play?`,`The fruit stands for the sweetness of life that is open to all. Derry's sharing of apples shows he is ready to join life.`],
[`How does the title "On the Face of It" operate on two levels?`,`Literally it refers to Derry's burnt face. Figuratively it suggests that we judge by appearances and miss the real person.`],
[`What is the theme of loneliness and acceptance in the play?`,`Derry and Lamb are lonely and find companionship. Their friendship teaches that acceptance comes from sharing, not from outward looks.`],
[`How does Susan Hill use dialogue to reveal character?`,`Short, direct speech shows Derry's bitterness and Lamb's wisdom. The conversation makes the lessons seem natural and not preachy.`],
[`How does Mr. Lamb's death affect Derry's attitude?`,`Lamb's death shocks him, but instead of retreating he feels determined to return to the garden and face people.`],
[`What message does the play give about handling disability?`,`It says people should accept themselves, and society must accept others with kindness and equality, not pity.`]
],
18:[
[`What made Zitkala-Sa want to go to the school in the East?`,`She was fascinated by her friend's tales of red apples and a big ride on the train. Also curious to learn, she persuaded her mother.`],
[`Why does Zitkala-Sa's mother hesitate to send her to school?`,`Her mother feared losing her daughter to white men's ways and had seen her brother's change. She consented only reluctantly.`],
[`How does Zitkala-Sa feel on her first morning in the dining hall?`,`She feels embarrassed and bewildered by the bell, the strange customs and the shoes, and goes on eating only after being shown.`],
[`What warning does Judewin give her friend before the hair-cutting?`,`Judewin overhears that their long hair will be cut. She warns Zitkala-Sa, who decides to resist by hiding.`],
[`How does Zitkala-Sa resist, and why does she fail?`,`She hides under the bed but is dragged out and tied to a chair. The staff are stronger, so she loses her hair.`],
[`What does the cutting of hair mean in Native American tradition?`,`Only mourners or cowards had their hair cut. Losing it was therefore humiliating and an insult to her identity.`],
[`How does the hair-cutting episode reflect the loss of cultural identity?`,`The school treated Native customs as inferior and forced children to become like whites, destroying their self-respect.`],
[`How does Bama describe her walk home from school at the start of her account?`,`She enjoyed watching shops, street performers, political meetings and the market. The slow walk shows a child's curiosity.`],
[`Why did the sight of the landlord's man and the packet seem funny to Bama at first?`,`She saw the old man carrying vadai by a string, which looked comic. Only later she understood the cruelty of untouchability.`],
[`How does Bama's elder brother explain the discrimination she saw?`,`He explains that they belong to a so-called low caste, and that they are treated as untouchable by others.`],
[`What advice does the brother give Bama about education?`,`He urges her to study hard and make progress, because that is the way to earn respect and defy caste.`],
[`How does Bama react to the advice, and what is the result?`,`She is moved and works tirelessly, topping her class. Her success proves that education can overturn discrimination.`],
[`Compare the two narrators: how do both episodes expose discrimination?`,`Zitkala-Sa faces racial oppression and cultural erasure; Bama faces caste untouchability. Both resist through courage and, in Bama's case, education.`]
]
};

5:[
[`What is the significance of the title "Poets and Pancakes"?`,`It pairs the world of poets and literature with pancake make-up used in films. The title hints at a humorous mix of art and commerce at Gemini Studios.`],
[`What was Gemini Studios' emblem, and what does it tell us about the studio?`,`The emblem showed twins blowing bugles, a reference to the name Gemini. It displays the studio's proud, announcing image of itself.`],
[`Why does the writer describe the make-up room as a levelling place?`,`Everyone, from stars to extras, received the same pancake treatment. For a while the room made all artists look alike regardless of rank.`],
[`What does the writer's own job at Gemini show about the studio's working?`,`His duties in the story department were often unclear and seemed trivial. They reveal a loosely run, bureaucratic office with a lot of idle talent.`],
[`How does Kothamangalam Subbu's love of English poetry shape the story?`,`Subbu admired English poets and quoted them even in a Tamil film studio. His literary tastes make him a bridge between cinema and poetry.`],
[`How does the visit of the English poet Stephen Spender to Gemini Studios add to the humour?`,`Most staff did not know who he was, while Subbu admired him. The visit contrasts the poet's literary standing with the studio's indifference.`],
[`What role does humour and irony play in the writer's style?`,`Asokamitran describes oddities, such as idle experts and puzzled staff, in a dry, gently mocking tone. The irony reveals the studio's confusion without bitterness.`],
[`What picture of the 1940s film industry emerges from the chapter?`,`It shows a factory-like studio with rigid hierarchy, wasted talent and little recognition for writers. Yet it also shows warmth, creativity and quirky characters.`]
],
6:[
[`How does Christopher Silvester describe the importance of the interview in modern life?`,`He says it has become a major source of information about public figures. It shapes how we know celebrities and gives the public access to them.`],
[`What objection to the interview is expressed by V. S. Naipaul in the passage?`,`Naipaul says some people are wounded by interviews and lose a part of themselves. The remark suggests that the interview can intrude on personal identity.`],
[`What does Eco mean by his "interstices" and how does he use them for writing?`,`He says he fills small gaps of time during his day with writing. This explains how a busy professor produces novels.`],
[`How does Eco view the success of "The Name of the Rose"?`,`He treats it with humour and modesty, as a pleasant surprise rather than a plan. He still sees himself mainly as a scholar.`],
[`Why does Eco call "postmodern" a term good for everything?`,`He feels the word is used so loosely that it can mean almost anything. The remark shows his scepticism about fashionable labels.`],
[`How does Mukund Padmanabhan's questioning bring out Eco's personality?`,`His direct, curious questions invite Eco to explain his habits and views. Eco's witty answers show a relaxed, erudite character.`],
[`How does the Eco interview illustrate the interview as an art form?`,`The reader meets the person through spontaneous talk. It shows how a good interviewer can reveal ideas and character, not just facts.`],
[`What picture of a scholar's life emerges from Eco's answers?`,`Eco combines teaching, research and fiction, treating them as complementary. He suggests that curiosity, not rigid routine, drives creativity.`]
],
7:[
[`How does the author present Sophie's character and her family background in "Going Places"?`,`Sophie is imaginative, dreamy and restless, living in a modest family. Her longing for a better life shapes the story.`],
[`Why does Danny Casey's name have such power for Sophie?`,`Danny Casey is a young Irish football star, a hero to her. His fame stands for the glamour and escape she desires.`],
[`How does Sophie imagine her future as a boutique owner?`,`She dreams of owning a stylish boutique and meeting famous people. The picture is vivid but vague about how she will get there.`],
[`How does Geoff respond to Sophie's boasts, and what does he represent?`,`Geoff is realistic and sceptical about her stories. He represents the voice of practical life that doubts dreams.`],
[`How does Jansie's attitude to Sophie's fantasies differ from Geoff's?`,`Jansie is a friend who is unsure whether to believe Sophie but humours her. Her gentler reaction contrasts with Geoff's blunt reality.`],
[`Why does Sophie tell her family and friends that she met Danny Casey?`,`She wants to feel important and escape her ordinary life. Her lie shows how strongly fantasy competes with reality for her.`],
[`How does the story use the idea of waiting to show the gap between dream and reality?`,`Sophie waits for the meeting that she invented. Her waiting shows hope, but nothing happens, which signals the limits of fantasy.`],
[`What does the story suggest about aspiration in poor surroundings?`,`Dreams give young people hope, but without real opportunity they can mislead. The story treats Sophie with sympathy and gentle irony.`]
],
15:[
[`What is the Students on Ice programme, and why did Tishani Doshi join it?`,`It takes young people to the polar regions to learn about the environment first-hand. Doshi joined to witness Antarctica and share its lessons.`],
[`How does Doshi describe the voyage across the Drake Passage?`,`The crossing from South America is a rough, stormy sea passage. It marks the dramatic beginning of the journey to a remote continent.`],
[`What link does Doshi draw between India and Antarctica through Gondwana?`,`Millions of years ago India and Antarctica were joined in the supercontinent Gondwana. Rocks and fossils show a shared past.`],
[`Why does Doshi call Antarctica a continent of extremes?`,`It is the coldest, driest and windiest place on earth. Its harsh climate supports little life on land.`],
[`What does the absence of a native human population suggest about Antarctica's importance?`,`Without permanent residents, it remains largely untouched by settlement. It stands as a global heritage for science and peace.`],

{type:'Letter to Editor', marks:'5 marks · 120–150 words', q:'Write a letter to the Editor of a national daily expressing your concern about the increasing number of road accidents involving school students and suggesting measures to improve road safety.', a:'[Your address]<br>[Date]<br><br>The Editor<br>The Times of India<br>New Delhi<br><br>Subject: Rising road accidents involving school students<br><br>Sir,<br><br>Through the columns of your esteemed newspaper, I wish to draw attention to the alarming rise in road accidents involving school children. Reckless driving, lack of proper zebra crossings near schools, and absence of traffic police during school hours are major causes.<br><br>I suggest that speed breakers and zebra crossings be constructed near all schools, traffic police be deployed during arrival and departure times, and road-safety awareness programmes be conducted regularly. Strict action against overspeeding and drunk driving is also necessary.<br><br>I hope the authorities will take prompt action.<br><br>Yours faithfully,<br>[Your Name]'},
{type:'Letter to Editor', marks:'5 marks · 120–150 words', q:'Write a letter to the Editor highlighting the problem of air pollution in your city and suggesting practical solutions.', a:'[Your address]<br>[Date]<br><br>The Editor<br>The Hindustan Times<br>New Delhi<br><br>Subject: Growing air pollution in the city<br><br>Sir,<br><br>I wish to express my concern over the deteriorating air quality in our city. Vehicular emissions, construction dust and burning of waste have made the air hazardous, especially for children and the elderly.<br><br>The authorities should promote public transport, enforce strict emission norms, increase green cover and ban open burning of garbage. Citizens must also switch to cleaner fuels and car-pooling.<br><br>Immediate steps are needed to protect public health.<br><br>Yours faithfully,<br>[Your Name]'},
{type:'Job Application', marks:'5 marks · 120–150 words', q:'You are applying for the post of Content Writer in a reputed publishing house. Write a job application letter with a brief bio-data.', a:'[Your address]<br>[Date]<br><br>The Manager<br>Horizon Publishers<br>New Delhi<br><br>Subject: Application for the post of Content Writer<br><br>Sir,<br><br>With reference to your advertisement in The Times of India dated 10 October 2026, I wish to apply for the post of Content Writer. I am a graduate in English with one year of experience in content writing.<br><br>I am enclosing my bio-data for your kind consideration. I shall be grateful if you call me for an interview.<br><br>Yours faithfully,<br>[Your Name]<br><br>Bio-data<br>Name: …<br>Age: …<br>Qualifications: B.A. English (Hons)<br>Experience: 1 year as freelance content writer<br>Skills: Creative writing, SEO basics, MS Office<br>Contact: …'},
{type:'Complaint Letter', marks:'5 marks · 120–150 words', q:'You bought a smartphone from an online store which stopped working within a week. Write a letter of complaint to the customer care manager demanding a replacement or refund.', a:'[Your address]<br>[Date]<br><br>The Customer Care Manager<br>TechMart Online<br>New Delhi<br><br>Subject: Complaint regarding defective smartphone – Order No. TM12345<br><br>Sir,<br><br>I purchased a smartphone (Order No. TM12345) from your website on 5 October 2026. Within a week the phone started hanging and the battery drains within two hours. I have already contacted customer support but received no satisfactory response.<br><br>I request you to replace the phone or refund the full amount at the earliest. I am attaching the invoice and photographs of the defect.<br><br>Yours faithfully,<br>[Your Name]'},
{type:'Article', marks:'5 marks · 120–150 words', q:'Write an article on “The Importance of Reading in the Digital Age” for your school magazine.', a:'The Importance of Reading in the Digital Age<br><br>In an age dominated by short videos and social media, the habit of reading books is slowly disappearing. Yet reading remains essential for developing concentration, vocabulary and critical thinking.<br><br>Books take us to different worlds, introduce us to new ideas and improve our language skills. Unlike digital content, which is often superficial, a good book encourages deep thinking. Schools and parents must encourage children to read at least 20–30 minutes daily. Libraries should be made more attractive and reading clubs should be formed.<br><br>Reading is not just a hobby; it is a lifelong investment in knowledge and imagination.'},
{type:'Article', marks:'5 marks · 120–150 words', q:'Write an article on “Mental Health of Students” highlighting the pressures faced by Class 12 students and suggesting ways to cope.', a:'Mental Health of Students: A Growing Concern<br><br>Class 12 students today face immense pressure from board examinations, parental expectations and competition for college admissions. This often leads to anxiety, sleep disorders and loss of interest in studies.<br><br>Schools should appoint counsellors, reduce the emphasis on marks alone and introduce yoga or mindfulness sessions. Parents must create a supportive atmosphere at home instead of adding to the pressure. Students themselves should maintain a balanced routine, take short breaks and talk to friends or teachers when stressed.<br><br>Mental health is as important as academic success. A healthy mind is the foundation of a successful life.'},
{type:'Report', marks:'5 marks · 120–150 words', q:'You are the student editor of your school magazine. Write a report on the Annual Sports Day celebrated in your school.', a:'Annual Sports Day Celebrated with Enthusiasm<br><br>New Delhi, 18 October 2026: The Annual Sports Day of Sunshine Public School was celebrated on 17 October 2026 with great enthusiasm. The chief guest, Mr. Rajesh Kumar, a former national athlete, inaugurated the event by lighting the torch.<br><br>Students participated in various track and field events, including 100 m, 200 m, long jump and relay races. The march past by the four houses was a visual treat. The Red House emerged as the overall champion. The chief guest distributed prizes and appreciated the sporting spirit of the students.<br><br>The event concluded with the national anthem and a vote of thanks by the Sports Captain.'},
{type:'Report', marks:'5 marks · 120–150 words', q:'Write a report on a tree-plantation drive organised by your school’s Eco Club.', a:'Tree Plantation Drive by Eco Club<br><br>City School, 10 October 2026: The Eco Club of City School organised a tree-plantation drive on 9 October 2026 in the school premises and the nearby park. More than 150 students and teachers participated.<br><br>Saplings of neem, peepal and gulmohar were planted. The Principal addressed the gathering and stressed the importance of trees in fighting pollution. Each student took a pledge to nurture the sapling he or she had planted.<br><br>The drive was a great success and will be followed by regular monitoring of the plants.'},
{type:'Speech', marks:'5 marks · 120–150 words', q:'You have to deliver a speech in the morning assembly on “The Role of Youth in Nation Building”. Write the speech.', a:'Respected Principal, teachers and my dear friends,<br><br>Good morning. Today I stand before you to speak on “The Role of Youth in Nation Building”.<br><br>The youth are the future of any nation. With energy, new ideas and idealism, young people can bring positive change. We can fight social evils, promote education, protect the environment and use technology for the good of society.<br><br>However, this is possible only if we remain disciplined, honest and hard-working. Let us channel our energy into constructive activities and become responsible citizens.<br><br>Thank you.'},
{type:'Speech', marks:'5 marks · 120–150 words', q:'Write a speech on “Say No to Drugs” to be delivered in your school.', a:'Respected Principal, teachers and dear friends,<br><br>Good morning. I am here to speak on a very important topic – “Say No to Drugs”.<br><br>Drug abuse is destroying the lives of many young people. It damages health, ruins careers and breaks families. Peer pressure and curiosity are the main reasons why students fall into this trap.<br><br>We must stay away from drugs, choose good friends and focus on studies and sports. If anyone is already addicted, they should seek help from teachers, parents or counsellors without delay.<br><br>Let us take a pledge today to say a firm no to drugs.<br><br>Thank you.'},
{type:'Debate', marks:'5 marks · 120–150 words', q:'Write a debate in favour of the motion: “Online education is better than classroom education.”', a:'Honourable judges, teachers and friends,<br><br>I stand here to speak in favour of the motion that online education is better than classroom education.<br><br>Online education offers flexibility of time and place. Students can learn at their own pace and revisit recorded lectures. It saves travel time and money and proved its usefulness during the pandemic. With good internet and digital tools, quality education can reach even remote areas.<br><br>While classroom education has its advantages, online learning is the need of the hour and can complement traditional methods effectively.<br><br>Thank you.'},
{type:'Debate', marks:'5 marks · 120–150 words', q:'Write a debate against the motion: “Social media does more harm than good.”', a:'Honourable judges and dear friends,<br><br>I oppose the motion that social media does more harm than good.<br><br>Social media connects people across the world, helps students in learning, spreads awareness about social issues and provides a platform for small businesses. During emergencies it has proved invaluable for sharing information.<br><br>Yes, misuse exists, but the solution lies in responsible use and digital literacy, not in rejecting the medium itself. Social media, when used wisely, is a powerful tool for good.<br><br>Thank you.'},

{type:'Poster', marks:'4 marks · 50 words', q:'Design a poster on “Clean India, Green India” for a school campaign.', a:'CLEAN INDIA<br>GREEN INDIA<br><br>Keep Your City Clean<br>• Do not litter<br>• Segregate waste<br>• Plant more trees<br>• Use dustbins<br><br>Swachh Bharat, Swasth Bharat<br>Organised by NSS Unit'},
{type:'Invitation', marks:'4 marks · 50 words', q:'Draft an informal invitation to your friend inviting him/her to spend the winter vacation with you.', a:'Dear Rohan,<br><br>I am organising a small get-together at my place during the winter vacation. I would be very happy if you could join us from 25–28 December. We plan to go for a picnic and play some indoor games. Please confirm.<br><br>Yours lovingly,<br>Amit'},
{type:'Letter to Editor', marks:'5 marks · 120–150 words', q:'Write a letter to the Editor about the poor condition of government hospitals in your city.', a:'[Your address]<br>[Date]<br><br>The Editor<br>The Indian Express<br>New Delhi<br><br>Subject: Poor condition of government hospitals<br><br>Sir,<br><br>I wish to highlight the miserable condition of government hospitals in our city. Shortage of doctors, dirty wards, lack of medicines and long waiting hours have made these hospitals unreliable for the common man.<br><br>The government should increase the health budget, appoint more staff, ensure regular supply of medicines and improve cleanliness. Only then will the poor receive the medical care they deserve.<br><br>Yours faithfully,<br>[Your Name]'},
{type:'Article', marks:'5 marks · 120–150 words', q:'Write an article on “The Impact of Climate Change on India”.', a:'The Impact of Climate Change on India<br><br>Climate change is no longer a distant threat; it is already affecting India. Unpredictable monsoons, rising temperatures, melting Himalayan glaciers and frequent floods and droughts are clear signs.<br><br>Agriculture, water resources and coastal cities are particularly vulnerable. Extreme weather events are becoming more common, causing loss of life and property.<br><br>India must accelerate its renewable energy programme, promote afforestation and encourage sustainable lifestyles. Every citizen has a role to play by reducing waste and conserving resources.<br><br>The time to act is now.'},
{type:'Report', marks:'5 marks · 120–150 words', q:'Write a report on a workshop on Cyber Safety organised in your school.', a:'Cyber Safety Workshop Held<br><br>Riverdale School, 8 October 2026: A workshop on Cyber Safety was organised for students of Classes IX to XII on 7 October 2026. The resource person, Mr. Anil Mehta, an IT expert, explained the dangers of cyberbullying, phishing and online fraud.<br><br>He demonstrated how to create strong passwords and protect personal information. Students asked several questions and found the session very useful. The Principal thanked the speaker and announced that similar workshops would be held regularly.<br><br>The workshop successfully raised awareness about safe internet practices.'},
{type:'Speech', marks:'5 marks · 120–150 words', q:'Write a speech on “Importance of Time Management for Students”.', a:'Respected Principal, teachers and dear friends,<br><br>Good morning. Today I will speak on the importance of time management.<br><br>Time once lost can never be regained. Students who manage their time well perform better in studies, have time for hobbies and feel less stressed. Making a daily timetable, prioritising tasks and avoiding procrastination are simple but effective habits.<br><br>Let us value every minute and use it wisely. Success belongs to those who respect time.<br><br>Thank you.'},
{type:'Job Application', marks:'5 marks · 120–150 words', q:'You have seen an advertisement for the post of Librarian in a public school. Write a job application with bio-data.', a:'[Your address]<br>[Date]<br><br>The Principal<br>Modern Public School<br>New Delhi<br><br>Subject: Application for the post of Librarian<br><br>Sir/Madam,<br><br>With reference to your advertisement in The Hindu dated 5 October 2026, I wish to apply for the post of Librarian. I hold a Bachelor’s degree in Library Science and have two years of experience.<br><br>I am enclosing my bio-data. I look forward to an opportunity to serve your institution.<br><br>Yours faithfully,<br>[Your Name]<br><br>Bio-data attached (qualifications, experience, contact details).'},
{type:'Article', marks:'5 marks · 120–150 words', q:'Write an article on “Women Empowerment in Modern India”.', a:'Women Empowerment in Modern India<br><br>Women in India have made remarkable progress in education, sports, politics and entrepreneurship. Yet challenges such as gender discrimination, safety concerns and unequal pay still exist.<br><br>True empowerment means equal opportunities, quality education, economic independence and a safe environment. Government schemes, legal reforms and changing social attitudes are slowly making a difference.<br><br>Every section of society must work together so that women can realise their full potential and contribute equally to the nation’s progress.'},
